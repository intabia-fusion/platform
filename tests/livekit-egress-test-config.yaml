# LiveKit Egress for sanity tests.
# Connects to host LiveKit (run_livekit_test.sh) on port 7890.
# Uses redis-test container for job queue.

api_key: testkey
api_secret: testsecret_for_sanity_tests_min32chars

ws_url: ws://host.docker.internal:7890
insecure: true

redis:
  address: redis-test:6379
  db: 0

logging:
  json: false
  level: debug

template_port: 7896
prometheus_port: 0
health_port: 0
debug_handler_port: 0

storage:
  s3:
    endpoint: http://minio:9000
    access_key: minioadmin
    secret: minioadmin
    bucket: livekit-recordings-test
    region: us-east-1
    forcePathStyle: true
    max_retries: 3
    min_retry_delay: 500ms
    max_retry_delay: 5s

session_limits:
  file_output_max_duration: 1h
  stream_output_max_duration: 30m
  segment_output_max_duration: 1h
