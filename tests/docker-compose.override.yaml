services:
  account:
    environment:
      - DB_URL=${DB_PG_URL}
      - STORAGE_CONFIG=${DATALAKE_STORAGE_CONFIG}
      - PROCEED_V7_MONGO=false
  transactor0:
    environment:
      - DB_URL=${DB_PG_URL}
      - STORAGE_CONFIG=${DATALAKE_STORAGE_CONFIG}
  workspace:
    environment:
      - DB_URL=${DB_PG_URL}
      - STORAGE_CONFIG=${DATALAKE_STORAGE_CONFIG}
      - ACCOUNTS_DB_URL=${DB_PG_URL}
  fulltext:
    environment:
      - DB_URL=${DB_PG_URL}
      - STORAGE_CONFIG=${DATALAKE_STORAGE_CONFIG}
  front0:
    environment:
      - STORAGE_CONFIG=${DATALAKE_STORAGE_CONFIG}
      - FILES_URL=http://localhost:4031/blob/:workspace/:blobId/:filename
      - UPLOAD_URL=http://localhost:4031/upload/form-data/:workspace
      - DATALAKE_URL=http://localhost:4031
      - PREVIEW_URL=http://localhost:8083/_preview
  datalake:
    image: 'intabiafusion/datalake:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      minio:
        condition: service_healthy
      cockroach:
        condition: service_started
      stats:
        condition: service_started
      account:
        condition: service_started
    ports:
      - 4031:4031
      - FILES_URL=http://localhost:4031/blob/:workspace/:blobId/:filename
      - UPLOAD_URL=http://localhost:4031/upload/form-data/:workspace
      - DATALAKE_URL=http://localhost:4031
      - PREVIEW_URL=http://localhost:8083/_preview
  collaborator0:
    environment:
      - STORAGE_CONFIG=${DATALAKE_STORAGE_CONFIG}
  notifications:
    environment:
      - DB_URL=${DB_PG_URL}
  activity:
    environment:
      - DB_URL=${DB_PG_URL}
  db-migrator:
    environment:
      - DB_URL=${DB_PG_URL}
