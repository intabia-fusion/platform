services:
  stream:
    image: intabiafusion/stream
    pull_policy: never
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      datalake:
        condition: service_started
    environment:
      - STREAM_ENDPOINT_URL=datalake://datalake:4031
      - STREAM_INSECURE=true
      - STREAM_SERVER_SECRET=secret
      - STREAM_REGION=
      - STREAM_QUEUE_CONFIG=${QUEUE_CONFIG}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
    ports:
      - 1081:1080
    restart: unless-stopped
  time-machine:
    image: intabiafusion/worker
    pull_policy: never
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      redpanda:
        condition: service_started
      account:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5433/postgres
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
    restart: unless-stopped
  activity:
    image: intabiafusion/activity
    pull_policy: never
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      redpanda:
        condition: service_started
      account:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5433/postgres
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=
      - ACCOUNTS_URL=http://huly.local:3003
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - SECRET=secret
      - BRANDING_PATH=/var/cfg/branding.json
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
    restart: unless-stopped
  cockroach:
    image: cockroachdb/cockroach:v24.1.2
    ports:
      - '26258:26257'
      - '18089:8080'
    command: start-single-node --insecure
    restart: unless-stopped
  postgres:
    image: postgres:18.1
    command: ["postgres", "-p", "5433"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 5433:5433
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    restart: unless-stopped
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9093,external://0.0.0.0:19093
      - --advertise-kafka-addr internal://redpanda:9093,external://localhost:19093
      - --pandaproxy-addr internal://0.0.0.0:8084,external://0.0.0.0:18084
      - --advertise-pandaproxy-addr internal://redpanda:8084,external://localhost:18084
      - --schema-registry-addr internal://0.0.0.0:8083,external://0.0.0.0:18083
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - 18083:18083
      - 18084:18084
      - 19093:19093
      - 19645:9644
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'info']
      interval: 10s
      timeout: 5s
      retries: 10
  redpanda_console:
    image: docker.redpanda.com/redpandadata/console:v2.8.3
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9093"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda:8083"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - 8001:8080
    depends_on:
      - redpanda
  minio:
    image: 'minio/minio'
    command: server /data --address ":9000" --console-address ":9001"
    expose:
      - 9000
      - 9001
    ports:
      - 9002:9000
      - 9003:9001
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10
  elastic-plugins:
    image: intabiafusion/elastic-plugins:8.19.1-slim
    command:
      - sh
      - -c
      - |
        cp -pr /usr/share/elasticsearch/plugins/* /mnt/plugins/
    volumes:
      - elastic-plugins:/mnt/plugins
  elastic:
    image: 'elasticsearch:8.19.1'
    command: >
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q analysis-icu || ./bin/elasticsearch-plugin install --batch analysis-icu; exec /usr/local/bin/docker-entrypoint.sh eswrapper -Ediscovery.type=single-node -Expack.security.enabled=false -Expack.security.http.ssl.enabled=false"
    expose:
      - 9200
    volumes:
      - elastic-plugins:/usr/share/elasticsearch/plugins
    depends_on:
      elastic-plugins:
        condition: service_completed_successfully
    ports:
      - 9201:9200
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
    healthcheck:
      interval: 5s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
  account:
    image: intabiafusion/account
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - minio
      - cockroach
      - postgres
    ports:
      - 3003:3003
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
      - ./region-config.yaml:/var/cfg/region-config.yaml
    environment:
      - ACCOUNT_PORT=3003
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - SERVER_SECRET=secret
      - ADMIN_EMAILS=admin,${PLATFORM_ADMIN_EMAILS}
      - WORKSPACE_LIMIT_PER_USER=100
      - DB_URL=${DB_PG_URL}
      - REGION_CONFIG=/var/cfg/region-config.yaml
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - BRANDING_PATH=/var/cfg/branding.json
      - STATS_URL=http://stats:4901
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
  workspace:
    image: intabiafusion/workspace
    pull_policy: never
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - cockroach
      - postgres
      - minio
      - redpanda
    depends_on:
      redpanda:
        condition: service_started
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - SERVER_SECRET=secret
      - DB_URL=${DB_PG_URL}
      - TRANSACTOR_URL=ws://transactor0:3334;ws://localhost:3334,ws://transactor1:3335;ws://localhost:3335
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - REGION=
      - ACCOUNTS_URL=http://account:3003
      - ACCOUNTS_DB_URL=${DB_PG_URL}
      - BRANDING_PATH=/var/cfg/branding.json
      - STATS_URL=http://stats:4901
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      - front0
      - front1
    ports:
      - 8083:8083
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
  front0:
    image: intabiafusion/front
    pull_policy: never
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - account
      - minio
      - elastic
      - collaborator0
      - collaborator1
      - stats
      - transactor0
      - transactor1
    volumes:
      - ./branding-test.json:/app/dist/branding-test.json
    environment:
      - SERVER_PORT=8083
      - SERVER_SECRET=secret
      - ACCOUNTS_URL_INTERNAL=http://account:3003
      - ACCOUNTS_URL=http://localhost:3003
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - GMAIL_URL=http://localhost:8088
      - CALENDAR_URL=http://localhost:8095
      - REKONI_URL=http://rekoni:4007
      - TELEGRAM_URL=http://localhost:8086
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - BRANDING_URL=http://localhost:8083/branding-test.json
      - STATS_URL=http://stats:4901
      - STATS_API=http://localhost:4901
      - STREAM_URL=http://localhost:1081/recording
      - DATALAKE_URL=http://localhost:4031
      - USE_OTP=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
  front1:
    image: intabiafusion/front
    pull_policy: never
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - account
      - minio
      - elastic
      - collaborator0
      - collaborator1
      - stats
      - transactor0
      - transactor1
    volumes:
      - ./branding-test.json:/app/dist/branding-test.json
    environment:
      - SERVER_PORT=8084
      - SERVER_SECRET=secret
      - ACCOUNTS_URL_INTERNAL=http://account:3003
      - ACCOUNTS_URL=http://localhost:3003
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - GMAIL_URL=http://localhost:8088
      - CALENDAR_URL=http://localhost:8095
      - REKONI_URL=http://rekoni:4007
      - TELEGRAM_URL=http://localhost:8086
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - BRANDING_URL=http://localhost:8083/branding-test.json
      - STATS_URL=http://stats:4901
      - STATS_API=http://localhost:4901
      - STREAM_URL=http://localhost:1081/recording
      - DATALAKE_URL=http://localhost:4031
      - USE_OTP=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
  transactor0:
    image: intabiafusion/transactor
    pull_policy: never
    depends_on:
      redpanda:
        condition: service_started
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - elastic
      - minio
      - rekoni
      - cockroach
      - postgres
      - account
      - stats
      - redpanda
    ports:
      - 3334:3334
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - REGION=
      - SERVER_PORT=3334
      - SERVER_SECRET=secret
      - DB_URL=${DB_PG_URL}
      - METRICS_CONSOLE=false
      - METRICS_FILE=metrics.txt
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FRONT_URL=http://localhost:8083
      - ACCOUNTS_URL=http://account:3003
      - LAST_NAME_FIRST=true
      - BRANDING_PATH=/var/cfg/branding.json
      - FULLTEXT_URL=http://fulltext:4710
      - STATS_URL=http://stats:4901
      - ENABLE_COMPRESSION=true
      - RATE_LIMIT_MAX=25000
      - RATE_LIMIT_WINDOW=1000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
      - TRANSACTOR_ID=transactor0
  transactor1:
    image: intabiafusion/transactor
    pull_policy: never
    depends_on:
      redpanda:
        condition: service_started
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - elastic
      - minio
      - rekoni
      - cockroach
      - postgres
      - account
      - stats
      - redpanda
    ports:
      - 3335:3335
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - REGION=
      - SERVER_PORT=3335
      - SERVER_SECRET=secret
      - DB_URL=${DB_PG_URL}
      - METRICS_CONSOLE=false
      - METRICS_FILE=metrics.txt
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FRONT_URL=http://localhost:8083
      - ACCOUNTS_URL=http://account:3003
      - LAST_NAME_FIRST=true
      - BRANDING_PATH=/var/cfg/branding.json
      - FULLTEXT_URL=http://fulltext:4710
      - STATS_URL=http://stats:4901
      - ENABLE_COMPRESSION=true
      - RATE_LIMIT_MAX=25000
      - RATE_LIMIT_WINDOW=1000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
      - TRANSACTOR_ID=transactor1
  collaborator0:
    image: intabiafusion/collaborator
    pull_policy: never
    links:
      - minio
      - transactor0
      - transactor1
    extra_hosts:
      - 'huly.local:host-gateway'
    ports:
      - 3079:3079
    environment:
      - COLLABORATOR_PORT=3079
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FULLTEXT_URL=http://fulltext:4710
      - STATS_URL=http://stats:4901
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
    restart: unless-stopped
  collaborator1:
    image: intabiafusion/collaborator
    links:
      - minio
      - transactor0
      - transactor1
    extra_hosts:
      - 'huly.local:host-gateway'
    ports:
      - 3080:3080
    environment:
      - COLLABORATOR_PORT=3080
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FULLTEXT_URL=http://fulltext:4710
      - STATS_URL=http://stats:4901
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
    restart: unless-stopped
  rekoni:
    image: intabiafusion/rekoni-service
    pull_policy: never
    restart: on-failure
    extra_hosts:
      - 'huly.local:host-gateway'
    ports:
      - 4007:4004
    environment:
      - STATS_URL=http://stats:4901
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318

  fulltext:
    image: intabiafusion/fulltext
    pull_policy: never
    restart: unless-stopped
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      redpanda:
        condition: service_started
      cockroach:
        condition: service_started
      elastic:
        condition: service_healthy
    links:
      - elastic
      - cockroach
      - rekoni
      - redpanda
    ports:
      - 4710:4710
    environment:
      - PORT=4710
      - SERVER_SECRET=secret
      - DB_URL=${DB_PG_URL}
      - FULLTEXT_DB_URL=http://elastic:9200
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - ELASTIC_INDEX_NAME=local_storage_index
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - REKONI_URL=http://rekoni:4007
      - ACCOUNTS_URL=http://account:3003
      - STATS_URL=http://stats:4901
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
  stats:
    image: intabiafusion/stats
    pull_policy: never
    extra_hosts:
      - 'huly.local:host-gateway'
    ports:
      - 4901:4901
    environment:
      - PORT=4901
      - SERVER_SECRET=secret
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
    restart: unless-stopped
  notifications:
    image: intabiafusion/notifications
    pull_policy: never
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      redpanda:
        condition: service_started
      account:
        condition: service_started
      transactor0:
        condition: service_started
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - SECRET=secret
      - ACCOUNTS_URL=http://huly.local:3003
      - DB_URL=${DB_PG_URL}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FRONT_URL=http://localhost:8083
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
      - BRANDING_PATH=/var/cfg/branding.json
    restart: unless-stopped
  datalake:
    image: intabiafusion/datalake
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      minio:
        condition: service_healthy
      cockroach:
        condition: service_started
      stats:
        condition: service_started
      account:
        condition: service_started
    ports:
      - 4031:4031
    environment:
      - PORT=4031
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - STATS_URL=http://stats:4901
      - STREAM_URL=http://stream:1080/recording
      - DB_URL=${DB_PG_URL}
      - BUCKETS=blobs,eu|http://minio:9000?accessKey=minioadmin&secretKey=minioadmin
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
    restart: unless-stopped
  billing:
    image: intabiafusion/billing
    pull_policy: never
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      account:
        condition: service_started
    ports:
      - 4043:4043
    environment:
      - PORT=4043
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - DB_URL=${DB_PG_URL}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - USAGE_UPDATE_INTERVAL=30
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
    restart: unless-stopped

volumes:
  elastic-plugins:
