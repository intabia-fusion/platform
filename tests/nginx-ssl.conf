# Mounted into the nginx.conf server block by docker-compose.secure.yaml: the same routes over TLS.
listen 8443 ssl;
http2 on;
ssl_certificate /etc/nginx/certs/cert.pem;
ssl_certificate_key /etc/nginx/certs/key.pem;
# Plain HTTP sent to the TLS port gets a redirect instead of nginx's 400.
error_page 497 =301 https://$http_host$request_uri;
# Analytics is not published on this stand, so the browser reaches it through nginx.
location /_analytics/ { proxy_pass http://analytics:4018/; }
