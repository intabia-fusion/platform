# oaitt (GigaAM ONNX on CPU) as the STT backend of docker-compose.asr.yaml: `./prepare-pg.sh --asr`.
services:
  oaitt:
    image: "${DOCKER_REGISTRY:+${DOCKER_REGISTRY}/}${DOCKER_NAMESPACE:-intabiafusion}/oaitt-onnx:${OAITT_TAG:-1.0.0}"
    restart: unless-stopped

  aibot_client_asr:
    depends_on:
      oaitt:
        condition: service_healthy
    environment:
      - ASR_URL=http://oaitt:9007
