{{- if .Values.services.livekit.enabled }}
{{- $base := include "platform.baseConfigMap" . | fromYaml }}
{{- $redis := .Values.config.redisHost | default (get $base "REDIS_HOST") }}
{{- if not $redis }}{{ fail "livekit: provide ConfigMap/platform-base REDIS_HOST" }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: livekit-config
  namespace: '{{ .Values.global.namespace }}'
type: Opaque
stringData:
  livekit.yaml: |
    port: 7880
    rtc:
      udp_port: {{ .Values.services.livekit.udpHostPort }}
      tcp_port: {{ .Values.services.livekit.tcpHostPort }}
      use_external_ip: false
      enable_loopback_candidate: false
    turn:
      enabled: false
    redis:
      address: {{ printf "%s:6379" $redis | quote }}
    webhook:
      urls:
      - {{ printf "https://%s/_love/webhook" (include "platform.publicHost" .) | quote }}
      api_key: {{ .Values.secrets.loveSecret.webhookApiKey | quote }}
    keys:
      {{ .Values.secrets.loveSecret.apiKey | quote }}: {{ .Values.secrets.loveSecret.apiSecret | quote }}
      {{ .Values.secrets.loveSecret.webhookApiKey | quote }}: {{ .Values.secrets.loveSecret.webhookApiSecret | quote }}
    logging:
      json: false
      level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      containers:
      - name: livekit
        image: {{ .Values.services.livekit.image }}
        args:
        - --config
        - /etc/livekit/livekit.yaml
        - --node-ip
        - {{ .Values.services.livekit.advertiseAddress | quote }}
        env:
        {{- if .Values.global.tls.caSecretName }}
        - name: SSL_CERT_FILE
          value: /etc/ssl/platform-ca/tls.crt
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: /etc/livekit
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        ports:
        - containerPort: 7880
          hostPort: {{ .Values.services.livekit.apiHostPort }}
          protocol: TCP
        - containerPort: {{ .Values.services.livekit.tcpHostPort }}
          hostPort: {{ .Values.services.livekit.tcpHostPort }}
          protocol: TCP
        - containerPort: {{ .Values.services.livekit.udpHostPort }}
          hostPort: {{ .Values.services.livekit.udpHostPort }}
          protocol: UDP
        resources:
          requests:
            memory: '{{ .Values.services.livekit.memRequired }}M'
          limits:
            memory: '{{ .Values.services.livekit.memLimits }}M'
        readinessProbe:
          httpGet:
            path: /
            port: 7880
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: config
        secret:
          secretName: livekit-config
      {{- include "platform.caVolume" $ | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-api
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: livekit
  ports:
  - name: api
    port: 7880
    targetPort: 7880
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: livekit-ingress
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`livekit-{{ .Values.global.hostUrl }}`)
    kind: Rule
    services:
    - name: livekit-api
      port: 7880
{{- end }}
