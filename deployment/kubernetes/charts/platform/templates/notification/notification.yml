# source: kube/notification/notification.yml; subs: version, hostUrl, namespace
{{- if .Values.services.notification.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificator-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.notification.replicas }}
  selector:
    matchLabels:
      app: notificator-service
  template:
    metadata:
      labels:
        app: notificator-service
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- include "platform.nodeSelector" (dict "root" . "service" "notification") | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "notification") }}
        {{- include "platform.resources" (dict "root" . "service" "notification") | nindent 8 }}
        ports:
        - containerPort: 8091
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "notification") | nindent 8 }}
        - name: SOURCE
          value: platform@intabia.ru
        - name: PUSH_SUBJECT
          value: mailto:platform@intabia.ru
        - name: STATS_URL
          value: http://stats-service
        - name: ACCOUNTS_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: accountsUrl
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: QUEUE_REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: PUSH_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: pushPublicKey
        - name: PUSH_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: pushPrivateKey
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: mailAuthToken
        - name: APNS_PRODUCTION
          value: '{{ .Values.services.notification.apnsProduction }}'
        - name: APNS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: apnsKeyId
        - name: APNS_TEAM_ID
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: apnsTeamId
        - name: APNS_TOPIC
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: apnsTopic
        - name: APNS_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: apnsKey
        - name: FCM_SERVICE_ACCOUNT
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: fcmServiceAccount
        - name: RUSTORE_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: rustoreProjectId
        - name: RUSTORE_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: rustoreServiceToken
        {{- include "platform.otelEnv" . | nindent 8 }}
{{- end }}
