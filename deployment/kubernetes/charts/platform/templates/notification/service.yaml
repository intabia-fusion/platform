# 
# source: kube/notification/service.yaml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.notification.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: notificator-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: notificator-service
  ports:
  - port: 80
    targetPort: 8091

{{- end }}
