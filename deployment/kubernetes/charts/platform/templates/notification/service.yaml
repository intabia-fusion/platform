# source: kube/notification/service.yaml; subs: version, hostUrl, namespace
{{- if .Values.services.notification.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: notificator-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: notificator-service
  ports:
  - port: 80
    targetPort: 8091

{{- end }}
