{{- /*
Create Secrets from .Values.secrets.

Mapping:
  - .Values.secrets.platform -> Secret: platform-secret
  - .Values.secrets.gmailApi -> Secret: gmail-api
  - .Values.secrets.accountSecrets -> Secret: account-secrets
  - .Values.secrets.loveSecret -> Secret: love-secret
  - .Values.secrets.telegramBotApi -> Secret: telegram-bot-api
  - .Values.secrets.aibotSecret -> Secret: aibot-secret
  - .Values.secrets.calendarApi -> Secret: calendar-api
  - .Values.secrets.signSecret -> Secret: sign-secret (special-case for certificate.p12)
*/ -}}

{{- define "platform.renderSecretData" -}}
{{- range $k, $v := . }}
  {{ $k }}: {{ (printf "%v" $v | trim | b64enc) | quote }}
{{- end }}
{{- end -}}

{{- /* Legacy values class: renamed to secrets.platform (see values.yaml). Fail
        loudly instead of rendering placeholder credentials from chart defaults. */ -}}
{{- if .Values.secrets.anticrm }}{{ fail "secrets.anticrm was renamed to secrets.platform: yq -i '.secrets.platform = .secrets.anticrm | del(.secrets.anticrm)' <your-values>.yaml" }}{{ end -}}
{{- $base := include "platform.baseConfigMap" . | fromYaml }}
{{- $baseSecret := include "platform.baseSecret" . | fromYaml }}
{{- $stand := include "platform.stand" . }}
{{- $dbUrl := .Values.secrets.platform.dbUrl }}
{{- if not $dbUrl }}
  {{- $host := get $base "POSTGRES_HOST" }}
  {{- $port := get $base "POSTGRES_PORT" | default "5432" }}
  {{- $user := get $baseSecret "POSTGRES_USER" | b64dec }}
  {{- $password := get $baseSecret "POSTGRES_PASSWORD" | b64dec }}
  {{- if and $host $user $password }}
    {{- $dbUrl = printf "postgresql://%s:%s@%s:%s/%s?sslmode=disable" (urlquery $user) (urlquery $password) $host $port $stand }}
  {{- end }}
{{- end }}
{{- if not $dbUrl }}{{ fail "platform-base: set secrets.platform.dbUrl or provide postgres settings in ConfigMap/Secret platform-base" }}{{ end }}
{{- $s3Endpoint := get $base "S3_ENDPOINT" }}
{{- if and $s3Endpoint (not (contains "://" $s3Endpoint)) }}
  {{- $s3Endpoint = printf "http://%s" $s3Endpoint }}
{{- end }}
{{- $s3Kind := get $base "S3_KIND" | default "minio" }}
{{- $s3Region := get $base "S3_REGION" | default "auto" }}
{{- $s3Location := get $base "S3_LOCATION" | default "eu" }}
{{- $s3AccessKey := get $baseSecret "S3_ACCESS_KEY" | b64dec }}
{{- $s3SecretKey := get $baseSecret "S3_SECRET_KEY" | b64dec }}
{{- $datalakeStorageConfig := .Values.secrets.platform.datalakeStorageConfig }}
{{- $backupConfig := .Values.secrets.platform.backupConfig }}
{{- $chunksStorageConfig := .Values.secrets.platform.chunksStorageConfig }}
{{- if and $s3Endpoint $s3AccessKey $s3SecretKey }}
  {{- $query := printf "accessKey=%s&secretKey=%s" (urlquery $s3AccessKey) (urlquery $s3SecretKey) }}
  {{- $datalakeStorageConfig = $datalakeStorageConfig | default (printf "%s,%s|%s?%s&region=%s" $stand $s3Location $s3Endpoint $query (urlquery $s3Region)) }}
  {{- $backupConfig = $backupConfig | default (printf "%s|%s?%s&rootBucket=%s" $s3Kind $s3Endpoint $query $stand) }}
  {{- $chunksStorageConfig = $chunksStorageConfig | default (printf "%s|%s?%s&rootBucket=%s-chunks" $s3Kind $s3Endpoint $query $stand) }}
{{- end }}
{{- if not $datalakeStorageConfig }}{{ fail "platform-base: set secrets.platform.datalakeStorageConfig or provide S3 settings in ConfigMap/Secret platform-base" }}{{ end }}
{{- if not $backupConfig }}{{ fail "platform-base: set secrets.platform.backupConfig or provide S3 settings in ConfigMap/Secret platform-base" }}{{ end }}
{{- if not $chunksStorageConfig }}{{ fail "platform-base: set secrets.platform.chunksStorageConfig or provide S3 settings in ConfigMap/Secret platform-base" }}{{ end }}
{{- $platform := deepCopy .Values.secrets.platform }}
{{- $platform = set $platform "dbUrl" $dbUrl }}
{{- $platform = set $platform "datalakeStorageConfig" $datalakeStorageConfig }}
{{- $platform = set $platform "backupConfig" $backupConfig }}
{{- $platform = set $platform "chunksStorageConfig" $chunksStorageConfig }}
{{- $platform = merge $platform (include "platform.regionDbUrls" (dict "root" . "dbUrl" $dbUrl) | fromYaml) }}

{{- if .Values.secrets.platform }}
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secret
  namespace: '{{ .Values.global.namespace }}'
  labels:
    app: platform
    chart: '{{ .Chart.Name }}-{{ .Chart.Version }}'
    release: '{{ .Release.Name }}'
type: Opaque
data:
{{ include "platform.renderSecretData" $platform | indent 2 }}
{{- end }}

