{{- /* sign-secret: handle certificate content carefully. If value looks like base64, use it as-is.
        Otherwise, base64-encode it and place it under `data:` (so `helm template` shows the final base64). */ -}}
{{- $sign := (index .Values.secrets "signSecret") | default dict -}}
{{- $cert := (index $sign "certificate.p12") | default "" -}}
{{- if $cert }}
---
apiVersion: v1
kind: Secret
metadata:
  name: sign-secret
  namespace: '{{ .Values.global.namespace }}'
  labels:
    app: platform
    chart: '{{ .Chart.Name }}-{{ .Chart.Version }}'
    release: '{{ .Release.Name }}'
type: Opaque
{{ $raw := printf "%v" $cert | trim }}
{{ if regexMatch "^[A-Za-z0-9+/=]+$" $raw }}
data:
  certificate.p12: {{ $raw | quote }}
{{ else }}
data:
  certificate.p12: {{ ($raw | b64enc) | quote }}
{{ end }}
{{ end }}
