#
# source: kube/mail/ingress.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-smtp
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_smtp"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mail-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_smtp`)
    kind: Rule
    services:
    - name: mail-service
      port: 80
    middlewares:
    - name: strip-smtp
