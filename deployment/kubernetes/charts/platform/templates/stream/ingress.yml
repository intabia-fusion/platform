# 
# source: kube/stream/ingress.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-stream
  namespace: '{{ .Values.global.namespace }}'
spec:
  replacePathRegex:
    regex: "^/_stream(.*)$"
    replacement: "$1"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stream-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_stream`)
    kind: Rule
    services:
    - name: stream
      port: 80
    middlewares:
    - name: strip-stream
