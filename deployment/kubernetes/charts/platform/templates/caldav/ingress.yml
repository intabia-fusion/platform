# 
# source: kube/caldav/ingress.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.caldav.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-caldav
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_caldav"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: caldav-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_caldav`)
    kind: Rule
    services:
    - name: caldav-service
      port: 80
    middlewares:
    - name: strip-caldav

{{- end }}
