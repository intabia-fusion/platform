# source: kube/caldav/caldav.yaml; subs: version, hostUrl, namespace
{{- if .Values.services.caldav.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caldav
  labels:
    app: caldav
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.caldav.replicas }}
  selector:
    matchLabels:
      app: caldav
  template:
    metadata:
      labels:
        app: caldav
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.nodeSelector" (dict "root" . "service" "caldav") | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: caldav
        image: {{ include "platform.containerImage" (dict "root" . "service" "caldav" "image" "huly-caldav") }}
        ports:
        - containerPort: 9070
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "caldav") | nindent 8 }}
        - name: ACCOUNTS_URL
          value: http://account
        - name: KV_URL
          value: http://kvs
        - name: SERVER_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        {{- include "platform.otelEnv" . | nindent 8 }}
{{- end }}
