# 
# source: kube/caldav/caldav.yaml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.caldav.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caldav
  labels:
    app: caldav
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.caldav.replicas }}
  selector:
    matchLabels:
      app: caldav
  template:
    metadata:
      labels:
        app: caldav
    spec:
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: caldav
        image: {{ include "platform.containerImage" (dict "root" . "service" "caldav" "image" "huly-caldav") }}
        ports:
        - containerPort: 9070
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "caldav") | nindent 8 }}
        - name: ACCOUNTS_URL
          value: http://account
        - name: KV_URL
          value: http://kvs
        - name: SERVER_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn
        resources:
          requests:
            memory: '{{ .Values.services.caldav.memRequired }}M'
          limits:
            memory: '{{ .Values.services.caldav.memLimits }}M'
{{- end }}
