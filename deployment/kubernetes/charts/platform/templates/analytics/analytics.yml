# 
# source: kube/analytics/analytics.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.analytics.replicas }}
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "analytics" "image" "analytics-collector") }}
        resources:
          requests:
            memory: '{{ .Values.services.analytics.memRequired }}M'
          limits:
            memory: '{{ .Values.services.analytics.memLimits }}M'
        ports:
        - containerPort: 4007
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "analytics") | nindent 8 }}
        - name: EXTERNAL_REGIONS
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: EXTERNAL_REGIONS
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: PORT
          value: '4007'
        - name: STATS_URL
          value: http://stats-service
        - name: ACCOUNTS_URL
          value: http://account
        - name: SERVICE_ID
          value: analytics-collector-service
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn
