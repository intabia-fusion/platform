#
# source: kube/analytics/ingress.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-analytics
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_collector"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: analytics-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_collector`)
    kind: Rule
    services:
    - name: analytics-service
      port: 80
    middlewares:
    - name: strip-analytics
