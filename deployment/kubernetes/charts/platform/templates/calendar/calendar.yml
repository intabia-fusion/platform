# source: kube/calendar/calendar.yml; subs: version, hostUrl, namespace
{{- if .Values.services.calendar.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.calendar.replicas }}
  selector:
    matchLabels:
      app: calendar-service
  template:
    metadata:
      labels:
        app: calendar-service
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- include "platform.nodeSelector" (dict "root" . "service" "calendar") | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "calendar") }}
        {{- include "platform.resources" (dict "root" . "service" "calendar") | nindent 8 }}
        ports:
        - containerPort: 8095
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "calendar") | nindent 8 }}
        - name: STATS_URL
          value: http://stats-service
        - name: Credentials
          valueFrom:
            secretKeyRef:
              name: calendar-api
              key: credentials
        - name: WATCH_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: calendarPushUrl
        - name: ACCOUNTS_URL
          value: http://account
        - name: KVS_URL
          value: http://kvs
        - name: SYSTEM_EMAIL
          value: anticrm@hc.engineering
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        {{- include "platform.otelEnv" . | nindent 8 }}
{{- end }}
