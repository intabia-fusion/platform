# source: kube/calendar/ingress.yml; subs: version, hostUrl, namespace
{{- if .Values.services.calendar.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-calendar
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_calendar"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: calendar-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_calendar`)
    kind: Rule
    services:
    - name: calendar-service
      port: 80
    middlewares:
    - name: strip-calendar

{{- end }}
