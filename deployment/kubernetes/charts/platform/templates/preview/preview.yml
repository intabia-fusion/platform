# source: kube/preview/preview.yml; subs: version, hostUrl, namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.preview.replicas }}
  selector:
    matchLabels:
      app: preview
  template:
    metadata:
      labels:
        app: preview
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- include "platform.nodeSelector" (dict "root" . "service" "preview") | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "preview") }}
        command:
          - node
          - --max-old-space-size={{ int (div (mul .Values.services.preview.memLimits 90) 100) }}
          - bundle.js
        {{- include "platform.resources" (dict "root" . "service" "preview") | nindent 8 }}
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "preview") | nindent 8 }}
        - name: PORT
          value: '4040'
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: ACCOUNTS_URL
          value: http://account
        - name: STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        - name: CACHE_PATH
          value: /tmp/preview
        {{- include "platform.otelEnv" . | nindent 8 }}