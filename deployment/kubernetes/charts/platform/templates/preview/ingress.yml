# source: kube/preview/ingress.yml; subs: version, hostUrl, namespace
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-preview
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_preview"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: preview-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_preview`)
    kind: Rule
    services:
    - name: preview
      port: 80
    middlewares:
    - name: strip-preview
