# source: kube/rekoni/rekoni.yml; subs: version, hostUrl, namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: distro
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.distro.replicas }}
  selector:
    matchLabels:
      app: distro
  template:
    metadata:
      labels:
        app: distro
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "distro" "image" "desktop-distro") }}
        {{- include "platform.resources" (dict "root" . "service" "distro") | nindent 8 }}
        ports:
        - containerPort: 4409
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "distro") | nindent 8 }}
        - name: PORT
          value: '4409'