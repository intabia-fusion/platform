# source: kube/backup/backup0.yml; subs: version, hostUrl, namespace
{{- if .Values.services.backup.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.backup.replicas }}
  selector:
    matchLabels:
      app: backup
  template:
    metadata:
      labels:
        app: backup
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- include "platform.nodeSelector" (dict "root" . "service" "backup") | nindent 6 }}
      {{- if or .Values.global.tls.caSecretName .Values.global.coverage.enabled }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- include "platform.coverageVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "backup") }}
        command:
        - node
        - --max-old-space-size={{ int (div (mul .Values.services.backup.memLimits 90) 100) }}
        - bundle.js
        {{- include "platform.resources" (dict "root" . "service" "backup") | nindent 8 }}
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if or .Values.global.tls.caSecretName .Values.global.coverage.enabled }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- include "platform.coverageVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "backup") | nindent 8 }}
        - name: ACCOUNTS_URL
          value: http://account
        - name: ACCOUNTS_DB_URL
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: dbUrl
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: STATS_URL
          value: http://stats-service
        - name: BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: backupBucket
        - name: INTERVAL
          value: '{{ .Values.services.backup.interval }}'
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: dbUrl
        - name: POSTGRES_OPTIONS
          value: '{"connection":{"application_name":"backup"},"max":30}'
        - name: STORAGE
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: backupConfig
        - name: WORKSPACE_STORAGE
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        {{- include "platform.otelEnv" . | nindent 8 }}
{{- end }}
