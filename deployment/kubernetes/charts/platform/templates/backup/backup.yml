#
# source: kube/backup/backup0.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.backup.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.backup.replicas }}
  selector:
    matchLabels:
      app: backup
  template:
    metadata:
      labels:
        app: backup
    spec:
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "backup") }}
        command:
        - node
        - --max-old-space-size={{ int (div (mul .Values.services.backup.memLimits 90) 100) }}
        - bundle.js
        resources:
          requests:
            memory: '{{ .Values.services.backup.memRequired }}M'
          limits:
            memory: '{{ .Values.services.backup.memLimits }}M'
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "backup") | nindent 8 }}
        - name: ACCOUNTS_URL
          value: http://account
        - name: ACCOUNTS_DB_URL
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: dbUrl
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: STATS_URL
          value: http://stats-service
        - name: BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: backupBucket
        - name: INTERVAL
          value: '43200'
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: dbUrl
        - name: POSTGRES_OPTIONS
          value: '{"connection":{"application_name":"backup"},"max":30}'
        - name: STORAGE
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: backupConfig
        - name: WORKSPACE_STORAGE
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn

{{- end }}
