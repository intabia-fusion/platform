#
# source: kube/fulltext/fulltext.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulltext0
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.fulltext.replicas }}
  selector:
    matchLabels:
      app: fulltext0
  template:
    metadata:
      labels:
        app: fulltext0
    spec:
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "fulltext") }}
        command:
        - node
        - --heapsnapshot-signal=SIGUSR2
        - --max-old-space-size={{ int (div (mul .Values.services.fulltext.memLimits 90) 100) }}
        - bundle.js
        resources:
          requests:
            memory: '{{ .Values.services.fulltext.memRequired }}M'
          limits:
            memory: '{{ .Values.services.fulltext.memLimits }}M'
        ports:
        - containerPort: 3500
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "fulltext") | nindent 8 }}
        - name: SERVER_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: dbUrl
        - name: POSTGRES_OPTIONS
          value: '{"connection":{"application_name":"fulltext"},"max":5}'
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: FULLTEXT_DB_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: elasticUrl
        - name: ELASTIC_INDEX_NAME
          value: '{{ .Values.config.fulltextIndexName }}'
        - name: STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        - name: STATS_URL
          value: http://stats-service
        - name: REKONI_URL
          value: http://rekoni-service
        - name: ACCOUNTS_URL
          value: http://account
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn
        - name: HULYLAKE_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: hulyLakeUrl
