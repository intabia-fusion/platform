#
# source: kube/activity/activity.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.activity.replicas }}
  selector:
    matchLabels:
      app: activity-service
  template:
    metadata:
      labels:
        app: activity-service
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      containers:
        - name: app
          image: {{ include "platform.containerImage" (dict "root" . "service" "activity") }}
          resources:
            requests:
              memory: '{{ .Values.services.activity.memRequired }}M'
            limits:
              memory: '{{ .Values.services.activity.memLimits }}M'
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
          volumeMounts:
          {{- include "platform.caVolumeMount" $ | nindent 12 }}
            - mountPath: /var/cfg/branding.json
              name: branding
              subPath: branding.json
          env:
          {{- include "platform.extraEnv" (dict "root" $ "service" "activity") | nindent 12 }}
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: serverSecret
            - name: ACCOUNTS_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: accountsUrl
            - name: QUEUE_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: queueConfig
            - name: QUEUE_REGION
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: REGION
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: dbUrl
            - name: STORAGE_CONFIG
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: storageConfig
            - name: BRANDING_PATH
              value: /var/cfg/branding.json
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: platform-otel-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
                  optional: true
            - name: OTEL_EXPORTER_OTLP_COMPRESSION
              valueFrom:
                configMapKeyRef:
                  name: platform-otel-config
                  key: OTEL_EXPORTER_OTLP_COMPRESSION
                  optional: true
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: uptraceDsn
      volumes:
      {{- include "platform.caVolume" $ | nindent 8 }}
        - configMap:
            items:
              - key: branding.json
                path: branding.json
            name: branding
          name: branding
