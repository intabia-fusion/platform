# source: kube/activity/activity.yml; subs: version, hostUrl, namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.activity.replicas }}
  selector:
    matchLabels:
      app: activity-service
  template:
    metadata:
      labels:
        app: activity-service
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      containers:
        - name: app
          image: {{ include "platform.containerImage" (dict "root" . "service" "activity") }}
          {{- include "platform.resources" (dict "root" . "service" "activity") | nindent 10 }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
          volumeMounts:
          {{- include "platform.caVolumeMount" $ | nindent 12 }}
          {{- include "platform.coverageVolumeMount" $ | nindent 12 }}
            - mountPath: /var/cfg/branding.json
              name: branding
              subPath: branding.json
          env:
          {{- include "platform.extraEnv" (dict "root" $ "service" "activity") | nindent 12 }}
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: serverSecret
            - name: ACCOUNTS_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: accountsUrl
            - name: QUEUE_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: queueConfig
            - name: QUEUE_REGION
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: REGION
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: dbUrl
            - name: STORAGE_CONFIG
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: storageConfig
            - name: BRANDING_PATH
              value: /var/cfg/branding.json
            {{- include "platform.otelEnv" . | nindent 12 }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 8 }}
      {{- include "platform.coverageVolume" $ | nindent 8 }}
        - configMap:
            items:
              - key: branding.json
                path: branding.json
            name: branding
          name: branding
