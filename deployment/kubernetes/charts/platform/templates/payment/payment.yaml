# 
# source: kube/payment/payment.yaml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.payment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    app: payment
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.payment.replicas }}
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      annotations:
        checksum/plan-config: {{ .Files.Get "files/plan-config.yaml" | sha256sum }}
      labels:
        app: payment
    spec:
      containers:
      - name: payment
        image: {{ include "platform.containerImage" (dict "root" . "service" "payment") }}
        ports:
        - containerPort: 3040
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        - mountPath: /var/cfg/plan-config.yaml
          name: plan-config
          subPath: plan-config.yaml
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "payment") | nindent 8 }}
        - name: PORT
          value: '3040'
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: ACCOUNTS_URL
          value: http://account
        - name: STATS_URL
          value: http://stats-service
        # Без хвостового слэша: pod-payment конкатенирует `${FRONT_URL}/workbench/...`
        - name: FRONT_URL
          value: 'https://{{ include "platform.publicHost" . }}'
        - name: PLAN_CONFIG
          value: /var/cfg/plan-config.yaml
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: QUEUE_REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: PROVIDER
          value: '{{ .Values.services.payment.provider }}'
        {{- if .Values.services.payment.subscriptionRateLimitMax }}
        - name: SUBSCRIPTION_RATE_LIMIT_MAX
          value: '{{ .Values.services.payment.subscriptionRateLimitMax }}'
        {{- end }}
        {{- if eq .Values.services.payment.provider "tbank" }}
        - name: TBANK_SUBSCRIPTIONS_URL
          value: http://tbank-subscriptions
        {{- end }}
        - name: RUN_WINDOW_BACKFILL
          value: 'true'
        - name: POLAR_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: polarAccessToken
        - name: POLAR_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: polarWebhookSecret
        - name: POLAR_SUBSCRIPTION_PLANS
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: polarSucscriptionPlans
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn
        resources:
          requests:
            memory: '{{ .Values.services.payment.memRequired }}M'
          limits:
            memory: '{{ .Values.services.payment.memLimits }}M'
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      - configMap:
          name: plan-config
        name: plan-config
{{- end }}
