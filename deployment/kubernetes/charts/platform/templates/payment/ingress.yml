# source: kube/payment/ingress.yml; subs: version, hostUrl, namespace
{{- if .Values.services.payment.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-payment
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_payment"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: payment-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_payment`)
    kind: Rule
    services:
    - name: payment
      port: 80
    middlewares:
    - name: strip-payment


{{- end }}
