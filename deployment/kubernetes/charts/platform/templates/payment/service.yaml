# source: kube/payment/service.yaml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.payment.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: payment
  ports:
  - port: 80
    targetPort: 3040

{{- end }}
