apiVersion: apps/v1
kind: Deployment
metadata:
  name: link-preview
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.linkPreview.replicas }}
  selector:
    matchLabels:
      app: link-preview
  template:
    metadata:
      labels:
        app: link-preview
    spec:
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "linkPreview" "image" "link-preview") }}
        command:
          - node
          - --max-old-space-size={{ int (div (mul .Values.services.linkPreview.memLimits 90) 100) }}
          - bundle.js
        resources:
          requests:
            memory: '{{ .Values.services.linkPreview.memRequired }}M'
          limits:
            memory: '{{ .Values.services.linkPreview.memLimits }}M'
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "linkPreview") | nindent 8 }}
        - name: PORT
          value: '4042'
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
