apiVersion: apps/v1
kind: Deployment
metadata:
  name: link-preview
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.linkPreview.replicas }}
  selector:
    matchLabels:
      app: link-preview
  template:
    metadata:
      labels:
        app: link-preview
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- include "platform.nodeSelector" (dict "root" . "service" "linkPreview") | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "linkPreview" "image" "link-preview") }}
        command:
          - node
          - --max-old-space-size={{ int (div (mul .Values.services.linkPreview.memLimits 90) 100) }}
          - bundle.js
        {{- include "platform.resources" (dict "root" . "service" "linkPreview") | nindent 8 }}
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "linkPreview") | nindent 8 }}
        - name: PORT
          value: '4042'
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret