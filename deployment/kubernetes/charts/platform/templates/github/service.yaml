# 
# source: kube/github/service.yaml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.github.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: github
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: github
  ports:
  - port: 80
    targetPort: 3500

{{- end }}
