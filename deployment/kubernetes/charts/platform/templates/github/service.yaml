# source: kube/github/service.yaml; subs: version, hostUrl, namespace
{{- if .Values.services.github.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: github
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: github
  ports:
  - port: 80
    targetPort: 3500

{{- end }}
