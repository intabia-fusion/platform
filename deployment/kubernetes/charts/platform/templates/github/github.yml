# 
# source: kube/github/github.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.github.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.github.replicas }}
  selector:
    matchLabels:
      app: github
  template:
    metadata:
      labels:
        app: github
    spec:
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "github") }}
        command:
        - node
        - --heapsnapshot-signal=SIGUSR2
        - bundle.js
        resources:
          requests:
            memory: '{{ .Values.services.github.memRequired }}M'
          limits:
            memory: '{{ .Values.services.github.memLimits }}M'
        ports:
        - containerPort: 3500
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        - mountPath: /var/cfg/stage-branding.json
          name: branding
          subPath: branding.json
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "github") | nindent 8 }}
        - name: EXTERNAL_REGIONS
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: EXTERNAL_REGIONS
        - name: PORT
          value: '3500'
        - name: BOT_NAME
          value: huly-github-staging[bot]
        - name: STATS_URL
          value: http://stats-service
        - name: ACCOUNTS_URL
          value: http://account
        - name: APP_ID
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: githubAppId
        - name: CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: githubClientId
        - name: CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: githubClientSecret
        - name: WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: githubWebhookSecret
        - name: PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: githubPrivateKey
        - name: SERVER_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: FRONT_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: frontUrl
        - name: BRANDING_PATH
          value: /var/cfg/stage-branding.json
        - name: STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      - configMap:
          items:
          - key: branding.json
            path: branding.json
          name: branding
        name: branding

{{- end }}
