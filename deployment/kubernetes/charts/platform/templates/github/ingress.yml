# 
# source: kube/github/ingress.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.github.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-github
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_github"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: github-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_github`)
    kind: Rule
    services:
    - name: github
      port: 80
    middlewares:
    - name: strip-github

{{- end }}
