# 
# source: kube/export/service.yaml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.export.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: export-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: export-service
  ports:
  - port: 80
    targetPort: 4009

{{- end }}
