# source: kube/export/service.yaml; subs: version, hostUrl, namespace
{{- if .Values.services.export.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: export-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: export-service
  ports:
  - port: 80
    targetPort: 4009

{{- end }}
