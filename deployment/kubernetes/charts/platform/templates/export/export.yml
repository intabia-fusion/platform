# source: kube/export/export.yml; subs: version, hostUrl, namespace
{{- if .Values.services.export.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: export-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.export.replicas }}
  selector:
    matchLabels:
      app: export-service
  template:
    metadata:
      labels:
        app: export-service
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- include "platform.nodeSelector" (dict "root" . "service" "export") | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "export") }}
        command:
        - node
        - --max-old-space-size={{ int (div (mul .Values.services.export.memLimits 90) 100) }}
        - bundle.js
        {{- include "platform.resources" (dict "root" . "service" "export") | nindent 8 }}
        ports:
        - containerPort: 8095
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "export") | nindent 8 }}
        - name: PORT
          value: '4009'
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: MAIL_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: mailAuthToken
        - name: SERVICE_ID
          value: export-service
        - name: STATS_URL
          value: http://stats-service
        - name: STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        - name: ACCOUNTS_URL
          value: http://account
        {{- include "platform.otelEnv" . | nindent 8 }}
{{- end }}
