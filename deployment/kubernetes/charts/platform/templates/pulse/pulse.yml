# source: kube/pulse/pulse.yml; subs: version, hostUrl, namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.pulse.replicas }}
  selector:
    matchLabels:
      app: pulse-service
  template:
    metadata:
      labels:
        app: pulse-service
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "pulse" "image" "hulypulse") }}
        {{- include "platform.resources" (dict "root" . "service" "pulse") | nindent 8 }}
        ports:
        - containerPort: 8098
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "pulse") | nindent 8 }}
        - name: HULY_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: HULY_BIND_PORT
          value: '8098'
        - name: HULY_BACKEND
          value: memory
        {{- include "platform.otelEnv" . | nindent 8 }}