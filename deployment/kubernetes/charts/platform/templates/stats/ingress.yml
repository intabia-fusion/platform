# source: kube/stats/ingress.yml; subs: version, hostUrl, namespace
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-stats
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_stats"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stats-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_stats`)
    kind: Rule
    services:
    - name: stats-service
      port: 80
    middlewares:
    - name: strip-stats
