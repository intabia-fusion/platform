# source: kube/stats/stats.yml; subs: version, hostUrl, namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.stats.replicas }}
  selector:
    matchLabels:
      app: stats-service
  template:
    metadata:
      labels:
        app: stats-service
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- if or .Values.global.tls.caSecretName .Values.global.coverage.enabled }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- include "platform.coverageVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "stats") }}
        {{- include "platform.resources" (dict "root" . "service" "stats") | nindent 8 }}
        ports:
        - containerPort: 8095
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if or .Values.global.tls.caSecretName .Values.global.coverage.enabled }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- include "platform.coverageVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "stats") | nindent 8 }}
        - name: PORT
          value: '4900'
        - name: SERVER_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        {{- include "platform.otelEnv" . | nindent 8 }}