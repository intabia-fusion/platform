# source: kube/translate/translate.yml; subs: version, hostUrl, namespace
{{- if .Values.services.translate.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: translate
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.translate.replicas }}
  selector:
    matchLabels:
      app: translate
  template:
    metadata:
      labels:
        app: translate
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- include "platform.nodeSelector" (dict "root" . "service" "translate") | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "translate") }}
        {{- include "platform.resources" (dict "root" . "service" "translate") | nindent 8 }}
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "translate") | nindent 8 }}
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: ACCOUNTS_URL
          value: http://account
        - name: STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: QUEUE_REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: HULYLAKE_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: hulyLakeUrl
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: openaiApiKey
        - name: OPENAI_BASE_URL
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: openaiBaseUrl
        - name: BILLING_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: billingUrl
        {{- include "platform.otelEnv" . | nindent 8 }}
{{- end }}
