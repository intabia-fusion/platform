# 
# source: kube/mail-worker/mail-worker.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if index .Values.services "mail-worker" "enabled" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-worker
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ index .Values.services "mail-worker" "replicas" }}
  selector:
    matchLabels:
      app: mail-worker
  template:
    metadata:
      labels:
        app: mail-worker
    spec:
      tolerations:
      - key: 'node.kubernetes.io/unreachable'
        operator: 'Exists'
        effect: 'NoExecute'
        tolerationSeconds: 10
      - key: 'node.kubernetes.io/not-ready'
        operator: 'Exists'
        effect: 'NoExecute'
        tolerationSeconds: 10
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "mail-worker") }}
        resources:
          requests:
            memory: '{{ index .Values.services "mail-worker" "memRequired" }}M'
          limits:
            memory: '{{ index .Values.services "mail-worker" "memLimits" }}M'
        ports:
        - containerPort: 4050
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "mail-worker") | nindent 8 }}
        - name: PORT
          value: '4050'
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: ACCOUNTS_URL
          value: http://account
        - name: WORKSPACE_URL
          value: platform
        - name: IGNORED_ADDRESSES
          value: noreply@huly.app
        - name: HOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: mailHookToken
        - name: STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        - name: KVS_URL
          value: http://kvs
        - name: MAIL_URL
          value: http://mail-service
        - name: MAIL_AUTH
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: mailAuthToken
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: QUEUE_REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn

{{- end }}
