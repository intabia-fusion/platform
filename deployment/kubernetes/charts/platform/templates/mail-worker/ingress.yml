# 
# source: kube/mail-worker/ingress.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if index .Values.services "mail-worker" "enabled" }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-mail-api
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_mail-api"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mail-worker-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_mail-api`)
    kind: Rule
    services:
    - name: mail-worker
      port: 80
    middlewares:
    - name: strip-mail-api

{{- end }}
