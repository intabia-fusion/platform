# source: kube/mail-worker/service.yaml; subs: version, hostUrl, namespace
{{- if index .Values.services "mail-worker" "enabled" }}
apiVersion: v1
kind: Service
metadata:
  name: mail-worker
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: mail-worker
  ports:
  - port: 80
    targetPort: 4050

{{- end }}
