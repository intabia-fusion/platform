{{- if .Values.services.legal.enabled }}
{{- $legal := .Values.services.legal }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ $legal.replicas }}
  selector:
    matchLabels:
      app: legal
  template:
    metadata:
      labels:
        app: legal
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- include "platform.nodeSelector" (dict "root" . "service" "legal") | nindent 6 }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "legal" "image" "platform-legal") }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy | default "Always" }}
        ports:
        - containerPort: 80
        {{- include "platform.resources" (dict "root" . "service" "legal") | nindent 8 }}
        env:
        - name: PORT
          value: '80'
---
apiVersion: v1
kind: Service
metadata:
  name: legal
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: legal
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: legal-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/legal`)
    kind: Rule
    priority: 1000
    services:
    - name: legal
      port: 80
{{- end }}
