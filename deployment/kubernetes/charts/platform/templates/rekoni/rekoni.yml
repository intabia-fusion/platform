# source: kube/rekoni/rekoni.yml; subs: version, hostUrl, namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rekoni-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.rekoni.replicas }}
  selector:
    matchLabels:
      app: rekoni-service
  template:
    metadata:
      labels:
        app: rekoni-service
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "rekoni" "image" "rekoni-service") }}
        {{- include "platform.resources" (dict "root" . "service" "rekoni") | nindent 8 }}
        ports:
        - containerPort: 4004
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "rekoni") | nindent 8 }}
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: STATS_URL
          value: http://stats-service
        {{- include "platform.otelEnv" . | nindent 8 }}