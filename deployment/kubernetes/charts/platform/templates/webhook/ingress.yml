#
# source: kube/webhook/ingress.yml
# substitutions:
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.webhook.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-webhook
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_webhook"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: webhook-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_webhook`)
    kind: Rule
    services:
    - name: webhook
      port: 80
    middlewares:
    - name: strip-webhook
{{- end }}
