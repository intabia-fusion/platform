#
# source: kube/webhook/service.yaml
# substitutions:
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: webhook
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: webhook
  ports:
  - port: 80
    targetPort: 4043
{{- end }}
