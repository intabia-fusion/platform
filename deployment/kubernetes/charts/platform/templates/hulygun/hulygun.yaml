# 
# source: kube/hulygun/hulygun.yaml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.hulygun.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hulygun
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.hulygun.replicas }}
  selector:
    matchLabels:
      app: hulygun
  template:
    metadata:
      labels:
        app: hulygun
    spec:
      tolerations:
      - key: 'node.kubernetes.io/unreachable'
        operator: 'Exists'
        effect: 'NoExecute'
        tolerationSeconds: 10
      - key: 'node.kubernetes.io/not-ready'
        operator: 'Exists'
        effect: 'NoExecute'
        tolerationSeconds: 10
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "hulygun") }}
        resources:
          requests:
            memory: '{{ .Values.services.hulygun.memRequired }}M'
          limits:
            memory: '{{ .Values.services.hulygun.memLimits }}M'
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "hulygun") | nindent 8 }}
        - name: HULY_LOG
          value: debug
        - name: HULY_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: HULY_ACCOUNT_SERVICE
          value: http://account
        - name: HULY_EXTERNAL_REGIONS
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: EXTERNAL_REGIONS
        - name: HULY_ACCOUNT_SERVICE_RATE_LIMIT
          value: '50'
        - name: HULY_KAFKA_BOOTSTRAP
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: kafkaBootstrapServers
        - name: HULY_OTEL
          value: 'on'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn
        - name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION
          value: 'BASE2_EXPONENTIAL_BUCKET_HISTOGRAM'
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: 'DELTA'

{{- end }}
