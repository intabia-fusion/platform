# source: kube/hulygun/hulygun.yaml; subs: version, hostUrl, namespace
{{- if .Values.services.hulygun.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hulygun
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.hulygun.replicas }}
  selector:
    matchLabels:
      app: hulygun
  template:
    metadata:
      labels:
        app: hulygun
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "hulygun") }}
        {{- include "platform.resources" (dict "root" . "service" "hulygun") | nindent 8 }}
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "hulygun") | nindent 8 }}
        - name: HULY_LOG
          value: debug
        - name: HULY_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: HULY_ACCOUNT_SERVICE
          value: http://account
        - name: HULY_EXTERNAL_REGIONS
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: EXTERNAL_REGIONS
        - name: HULY_ACCOUNT_SERVICE_RATE_LIMIT
          value: '50'
        - name: HULY_KAFKA_BOOTSTRAP
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: kafkaBootstrapServers
        - name: HULY_OTEL
          value: 'on'
        {{- include "platform.otelEnv" . | nindent 8 }}
        - name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION
          value: BASE2_EXPONENTIAL_BUCKET_HISTOGRAM
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: DELTA
{{- end }}
