#
# source: kube/backup/ingress.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.backupApi.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-backup-api
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_backup-api"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backup-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_backup-api`)
    kind: Rule
    services:
    - name: backup-api-service
      port: 80
    middlewares:
    - name: strip-backup-api

{{- end }}
