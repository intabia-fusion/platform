#
# source: kube/backup/backup-api-service.yaml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.backupApi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: backup-api-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: backup-api
  ports:
  - port: 80
    targetPort: 4039

{{- end }}
