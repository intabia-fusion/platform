#
# source: kube/backup/backup-api.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.backupApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-api
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.backupApi.replicas }}
  selector:
    matchLabels:
      app: backup-api
  template:
    metadata:
      labels:
        app: backup-api
    spec:
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "backupApi" "image" "backup-api") }}
        command:
        - node
        - bundle.js
        resources:
          requests:
            memory: '{{ .Values.services.backupApi.memRequired }}M'
          limits:
            memory: '{{ .Values.services.backupApi.memLimits }}M'
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "backupApi") | nindent 8 }}
        - name: ACCOUNTS_URL
          value: http://account
        - name: PORT
          value: '4039'
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: STATS_URL
          value: http://stats-service
        - name: BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: backupBucket
        - name: STORAGE
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: backupConfig
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn
        # - name: OTEL_LOG_LEVEL
        #   value: all

{{- end }}
