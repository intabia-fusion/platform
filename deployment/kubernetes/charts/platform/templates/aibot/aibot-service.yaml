#
# source: kube/aibot/aibot-service.yaml
#
# aibot-service - роль event-router: REST для transactor и приём аудио от love-agent.
# Имя сохранено: transactor (AI_BOT_URL) и love-agent ходят на него.
# aibot-clisr - роль stt-worker: WebSocket-приёмник для внешних воркеров (MODE=client).
{{- if .Values.services.aibot.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: aibot-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: aibot-service
  ports:
  - port: 80
    targetPort: 4010

---
apiVersion: v1
kind: Service
metadata:
  name: aibot-clisr
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: aibot-clisr
  ports:
  - port: 80
    targetPort: 4010

{{- end }}
