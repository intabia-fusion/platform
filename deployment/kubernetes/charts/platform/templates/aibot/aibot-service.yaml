# source: kube/aibot/aibot-service.yaml. aibot-service - роль event-router: REST для transactor и
# приём аудио от love-agent (имя сохранено: на него ходят AI_BOT_URL и love-agent).
{{- if .Values.services.aibot.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: aibot-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: aibot-service
  ports:
  - port: 80
    targetPort: 4010

---
apiVersion: v1
kind: Service
metadata:
  name: aibot-clisr
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: aibot-clisr
  ports:
  - port: 80
    targetPort: 4010

{{- end }}
