# source: kube/love/love-agent.yml; subs: version, hostUrl, namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: love-agent-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.loveAgent.replicas }}
  selector:
    matchLabels:
      app: love-agent-service
  template:
    metadata:
      labels:
        app: love-agent-service
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- include "platform.nodeSelector" (dict "root" . "service" "loveAgent") | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "loveAgent" "image" "love-agent") }}
        command:
        - node
        - --max-old-space-size={{ int (div (mul .Values.services.loveAgent.memLimits 90) 100) }}
        - index.js
        - start
        {{- include "platform.resources" (dict "root" . "service" "loveAgent") | nindent 8 }}
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "loveAgent") | nindent 8 }}
        - name: AGENT_NAME
          value: transcription-{{ .Values.global.namespace }}
        - name: SERVER_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: LIVEKIT_API_KEY
          valueFrom:
            secretKeyRef:
              name: love-secret
              key: apiKey
        - name: LIVEKIT_API_SECRET
          valueFrom:
            secretKeyRef:
              name: love-secret
              key: apiSecret
        - name: LIVEKIT_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: livekitHost
        - name: STT_PROVIDER
          value: stream
        - name: PLATFORM_URL
          value: http://aibot-service
        {{- include "platform.otelEnv" . | nindent 8 }}