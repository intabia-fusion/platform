#
# source: kube/love/love-agent.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: love-agent-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.loveAgent.replicas }}
  selector:
    matchLabels:
      app: love-agent-service
  template:
    metadata:
      labels:
        app: love-agent-service
    spec:
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "loveAgent" "image" "love-agent") }}
        command:
        - node
        - --max-old-space-size={{ int (div (mul .Values.services.loveAgent.memLimits 90) 100) }}
        - index.js
        - start
        resources:
          requests:
            memory: '{{ .Values.services.loveAgent.memRequired }}M'
          limits:
            memory: '{{ .Values.services.loveAgent.memLimits }}M'
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "loveAgent") | nindent 8 }}
        - name: AGENT_NAME
          value: 'transcription-{{ .Values.global.namespace }}'
        - name: SERVER_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: LIVEKIT_API_KEY
          valueFrom:
            secretKeyRef:
              name: love-secret
              key: apiKey
        - name: LIVEKIT_API_SECRET
          valueFrom:
            secretKeyRef:
              name: love-secret
              key: apiSecret
        - name: LIVEKIT_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: livekitHost
        - name: STT_PROVIDER
          value: stream
        - name: PLATFORM_URL
          value: http://aibot-service
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn
