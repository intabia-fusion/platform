#
# source: kube/crm/ingress.yml
# substitutions:
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.crm.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-crm
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_crm"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: crm-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_crm`)
    kind: Rule
    services:
    - name: crm
      port: 80
    middlewares:
    - name: strip-crm
{{- end }}
