# source: kube/telegram-bot/service-webhook.yaml; subs: version, hostUrl, namespace
{{- if index .Values.services "telegram-bot" "enabled" }}
apiVersion: v1
kind: Service
metadata:
  name: telegram-bot-webhook-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: telegram-bot-service
  ports:
  - port: 80
    targetPort: 8443

{{- end }}
