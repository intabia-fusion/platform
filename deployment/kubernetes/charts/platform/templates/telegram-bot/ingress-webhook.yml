#
# source: kube/telegram-bot/ingress-webhook.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if index .Values.services "telegram-bot" "enabled" }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-telegram-hook
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_telegram-hook"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: telegram-bot-webhook-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_telegram-hook`)
    kind: Rule
    services:
    - name: telegram-bot-webhook-service
      port: 80
    middlewares:
    - name: strip-telegram-hook

{{- end }}
