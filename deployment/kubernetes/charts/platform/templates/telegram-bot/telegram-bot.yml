# 
# source: kube/telegram-bot/telegram-bot.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if index .Values.services "telegram-bot" "enabled" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bot-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ index .Values.services "telegram-bot" "replicas" }}
  selector:
    matchLabels:
      app: telegram-bot-service
  template:
    metadata:
      labels:
        app: telegram-bot-service
    spec:
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "telegram-bot") }}
        resources:
          requests:
            memory: '{{ index .Values.services "telegram-bot" "memRequired" }}M'
          limits:
            memory: '{{ index .Values.services "telegram-bot" "memLimits" }}M'
        ports:
        - containerPort: 4020
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "telegram-bot") | nindent 8 }}
        - name: PORT
          value: '4020'
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: dbUrl
        - name: POSTGRES_OPTIONS
          value: '{"connection":{"application_name":"telegramBot"},"max":2}'
        - name: BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegram-bot-api
              key: botToken
        - name: ACCOUNTS_URL
          value: http://account
        - name: STATS_URL
          value: http://stats-service
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: DOMAIN
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: telegramHookUrl
        - name: SERVICE_ID
          value: telegram-bot-service
        - name: STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: QUEUE_REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn

{{- end }}
