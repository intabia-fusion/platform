# source: kube/datalake/ingress.yml; subs: version, hostUrl, namespace
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-datalake
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_datalake"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: datalake-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_datalake`)
    kind: Rule
    services:
    - name: datalake-service
      port: 80
    middlewares:
    - name: strip-datalake
