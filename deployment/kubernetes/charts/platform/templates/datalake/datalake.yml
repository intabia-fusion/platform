# source: kube/datalake/datalake.yml; subs: version, hostUrl, namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datalake-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.datalake.replicas }}
  selector:
    matchLabels:
      app: datalake-service
  template:
    metadata:
      labels:
        app: datalake-service
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- include "platform.nodeSelector" (dict "root" . "service" "datalake") | nindent 6 }}
      {{- if or .Values.global.tls.caSecretName .Values.global.coverage.enabled }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- include "platform.coverageVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "datalake") }}
        command:
          - node
          - --max-old-space-size={{ int (div (mul .Values.services.datalake.memLimits 90) 100) }}
          - bundle.js
        {{- include "platform.resources" (dict "root" . "service" "datalake") | nindent 8 }}
        ports:
        - containerPort: 4030
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if or .Values.global.tls.caSecretName .Values.global.coverage.enabled }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- include "platform.coverageVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "datalake") | nindent 8 }}
        - name: PORT
          value: '4030'
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: SECURE
          value: 'true'
        - name: ACCOUNTS_URL
          value: http://account
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: dbUrl
        - name: POSTGRES_OPTIONS
          value: '{"connection":{"application_name":"datalake"},"max":10}'
        - name: BUCKETS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: datalakeStorageConfig
        - name: STATS_URL
          value: http://stats-service
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        {{- include "platform.otelEnv" . | nindent 8 }}