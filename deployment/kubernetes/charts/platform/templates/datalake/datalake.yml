#
# source: kube/datalake/datalake.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datalake-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.datalake.replicas }}
  selector:
    matchLabels:
      app: datalake-service
  template:
    metadata:
      labels:
        app: datalake-service
    spec:
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      {{- if or .Values.global.tls.caSecretName .Values.global.coverage.enabled }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- include "platform.coverageVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "datalake") }}
        command:
          - node
          - --max-old-space-size={{ int (div (mul .Values.services.datalake.memLimits 90) 100) }}
          - bundle.js
        resources:
          requests:
            memory: '{{ .Values.services.datalake.memRequired }}M'
          limits:
            memory: '{{ .Values.services.datalake.memLimits }}M'
        ports:
        - containerPort: 4030
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if or .Values.global.tls.caSecretName .Values.global.coverage.enabled }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- include "platform.coverageVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "datalake") | nindent 8 }}
        - name: PORT
          value: '4030'
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: SECURE
          value: 'true'
        - name: ACCOUNTS_URL
          value: http://account
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: dbUrl
        - name: POSTGRES_OPTIONS
          value: '{"connection":{"application_name":"datalake"},"max":10}'
        - name: BUCKETS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: datalakeStorageConfig
        - name: STATS_URL
          value: http://stats-service
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn
