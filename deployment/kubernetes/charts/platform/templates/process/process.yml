# source: kube/process/process.yml; subs: version, hostUrl, namespace
{{- if .Values.services.process.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: process-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.process.replicas }}
  selector:
    matchLabels:
      app: process-service
  template:
    metadata:
      labels:
        app: process-service
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- include "platform.nodeSelector" (dict "root" . "service" "process") | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "process") }}
        {{- include "platform.resources" (dict "root" . "service" "process") | nindent 8 }}
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "process") | nindent 8 }}
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: ACCOUNTS_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: accountsUrl
        - name: QUEUE_REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        {{- include "platform.otelEnv" . | nindent 8 }}
        - name: TEMPORAL_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: temporalUrl
        - name: TEMPORAL_NAMESPACE
          value: dev
{{- end }}
