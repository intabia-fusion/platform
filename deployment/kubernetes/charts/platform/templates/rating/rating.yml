# source: kube/rating/rating.yml; subs: version, hostUrl, namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.rating.replicas }}
  selector:
    matchLabels:
      app: rating-service
  template:
    metadata:
      labels:
        app: rating-service
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- include "platform.nodeSelector" (dict "root" . "service" "rating") | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "rating") }}
        {{- include "platform.resources" (dict "root" . "service" "rating") | nindent 8 }}
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "rating") | nindent 8 }}
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: SERVER_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: STATS_URL
          value: http://stats-service
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: dbUrl
        - name: POSTGRES_OPTIONS
          value: '{"connection":{"application_name":"rating"},"max":2}'
        - name: STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        - name: ACCOUNTS_URL
          value: http://account
        - name: COMMUNICATION_TIME_LOGGING_ENABLED
          value: 'true'
        - name: COMMUNICATION_API_ENABLED
          value: 'false'
        {{- include "platform.otelEnv" . | nindent 8 }}