#
# source: kube/love/love.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: love-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.love.replicas }}
  selector:
    matchLabels:
      app: love-service
  template:
    metadata:
      labels:
        app: love-service
    spec:
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "love") }}
        resources:
          requests:
            memory: '{{ .Values.services.love.memRequired }}M'
          limits:
            memory: '{{ .Values.services.love.memLimits }}M'
        ports:
        - containerPort: 8096
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "love") | nindent 8 }}
        - name: AGENTS
          value: 'transcription-{{ .Values.global.namespace }}'
        - name: WEBHOOK_URL
          value: 'https://{{ include "platform.publicHost" . }}/_love/webhook'
        - name: RECORDING_TEMPLATE_URL
          value: 'https://{{ include "platform.publicHost" . }}/_love/egress-template/'
        - name: EXTERNAL_REGIONS
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: EXTERNAL_REGIONS
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: STATS_URL
          value: http://stats-service
        - name: ACCOUNTS_URL
          value: http://account
        - name: LIVEKIT_HOST
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: livekitWs
        - name: STORAGE_PROVIDER_NAME
          value: datalake
        - name: STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        - name: S3_STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: love-secret
              key: s3StorageConfig
        - name: LIVEKIT_PROJECT
          value: '{{ .Values.config.livekitProject }}'
        - name: LIVEKIT_API_KEY
          valueFrom:
            secretKeyRef:
              name: love-secret
              key: apiKey
        - name: LIVEKIT_API_SECRET
          valueFrom:
            secretKeyRef:
              name: love-secret
              key: apiSecret
        - name: LIVEKIT_WEBHOOK_API_KEY
          valueFrom:
            secretKeyRef:
              name: love-secret
              key: webhookApiKey
        - name: LIVEKIT_WEBHOOK_API_SECRET
          valueFrom:
            secretKeyRef:
              name: love-secret
              key: webhookApiSecret
        - name: Port
          value: '8096'
        - name: BILLING_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: billingUrl
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn
