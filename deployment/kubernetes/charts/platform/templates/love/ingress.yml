# source: kube/love/ingress.yml; subs: version, hostUrl, namespace
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-love
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_love"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: love-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_love`)
    kind: Rule
    services:
    - name: love-service
      port: 80
    middlewares:
    - name: strip-love
