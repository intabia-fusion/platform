# source: kube/schedule/service.yml; subs: version, hostUrl, namespace
{{- if .Values.services.schedule.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: schedule
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: schedule
  ports:
  - port: 80
    targetPort: 8060

{{- end }}
