# 
# source: kube/schedule/service.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.schedule.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: schedule
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: schedule
  ports:
  - port: 80
    targetPort: 8060

{{- end }}
