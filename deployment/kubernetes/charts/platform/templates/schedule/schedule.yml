# source: kube/schedule/schedule.yml; subs: version, hostUrl, namespace
{{- if .Values.services.schedule.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schedule
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.schedule.replicas }}
  selector:
    matchLabels:
      app: schedule
  template:
    metadata:
      labels:
        app: schedule
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- include "platform.nodeSelector" (dict "root" . "service" "schedule") | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "schedule" "image" "huly-schedule") }}
        {{- include "platform.resources" (dict "root" . "service" "schedule") | nindent 8 }}
        ports:
        - containerPort: 8060
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "schedule") | nindent 8 }}
        - name: HOST
          value: 0.0.0.0
        - name: PORT
          value: '8060'
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: ACCOUNT_URL
          value: http://account
        - name: SMTP_URL
          value: http://mail-service
        - name: FRONT_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: frontUrl
        {{- include "platform.otelEnv" . | nindent 8 }}
{{- end }}
