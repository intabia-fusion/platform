{{- /*
The db-migrator is a pre-install/pre-upgrade hook: at that point the regular
release resources (Secret platform-secret among them) are not applied yet, so
the migrator gets its own hook Secret with the resolved stand database URL -
same resolution as platform-secret and db-init.
*/ -}}
{{- $base := include "platform.baseConfigMap" . | fromYaml }}
{{- $baseSecret := include "platform.baseSecret" . | fromYaml }}
{{- $stand := include "platform.stand" . }}
{{- $dbUrl := .Values.secrets.platform.dbUrl }}
{{- if not $dbUrl }}
  {{- $host := get $base "POSTGRES_HOST" }}
  {{- $port := get $base "POSTGRES_PORT" | default "5432" }}
  {{- $user := get $baseSecret "POSTGRES_USER" | b64dec }}
  {{- $password := get $baseSecret "POSTGRES_PASSWORD" | b64dec }}
  {{- if and $host $user $password }}
    {{- $dbUrl = printf "postgresql://%s:%s@%s:%s/%s?sslmode=disable" (urlquery $user) (urlquery $password) $host $port $stand }}
  {{- end }}
{{- end }}
{{- if not $dbUrl }}{{ fail "db-migrator: set secrets.platform.dbUrl or provide postgres settings in ConfigMap/Secret platform-base" }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-db-migrator
  namespace: '{{ .Values.global.namespace }}'
  labels:
    app: platform
    chart: '{{ .Chart.Name }}-{{ .Chart.Version }}'
    release: '{{ .Release.Name }}'
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  DB_URL: {{ $dbUrl | quote }}
  uptraceDsn: {{ .Values.secrets.platform.uptraceDsn | quote }}
