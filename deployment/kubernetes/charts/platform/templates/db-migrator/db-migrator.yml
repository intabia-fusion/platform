#
# source: kube/db-migrator/db-migrator.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   namespace -> {{ .Values.global.namespace }}
apiVersion: batch/v1
kind: Job
metadata:
  name: 'db-migrator-{{ .Values.global.version | replace "." "-" | replace ":" "-" }}'
  namespace: '{{ .Values.global.namespace }}'
  annotations:
    # Job pod templates are immutable - as a hook the migrator is recreated on
    # every upgrade instead of patched, so template changes never block upgrades.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ index .Values.services "db-migrator" "backoffLimit" }}
  ttlSecondsAfterFinished: {{ index .Values.services "db-migrator" "ttlSecondsAfterFinished" }}
  template:
    metadata:
      labels:
        app: db-migrator
    spec:
      restartPolicy: Never
      tolerations:
      - key: 'node.kubernetes.io/unreachable'
        operator: 'Exists'
        effect: 'NoExecute'
        tolerationSeconds: 10
      - key: 'node.kubernetes.io/not-ready'
        operator: 'Exists'
        effect: 'NoExecute'
        tolerationSeconds: 10
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "db-migrator") }}
        resources:
          requests:
            memory: '{{ index .Values.services "db-migrator" "memRequired" }}M'
          limits:
            memory: '{{ index .Values.services "db-migrator" "memLimits" }}M'
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "db-migrator") | nindent 8 }}
        - name: SERVICE_ID
          value: db-migrator
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: platform-db-migrator
              key: DB_URL
        - name: DB_URLS
          valueFrom:
            secretKeyRef:
              name: platform-db-migrator
              key: DB_URLS
        - name: POSTGRES_OPTIONS
          value: '{"connection":{"application_name":"db-migrator"},"max":2}'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-db-migrator
              key: uptraceDsn
        # One run per database: the stand DB first, then every per-region DB
        # (config.regions[].db) - same schema, same migrator image.
        command:
        - sh
        - -ec
        - |
          for url in $DB_URLS; do
            db="${url##*/}"
            db="${db%%\?*}"
            echo ">> migrating $db"
            DB_URL="$url" node bundle.js
          done
