# source: kube/print/print.yml; subs: version, hostUrl, namespace
{{- if .Values.services.print.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: print-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.print.replicas }}
  selector:
    matchLabels:
      app: print-service
  template:
    metadata:
      labels:
        app: print-service
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "print") }}
        command:
          - node
          - --max-old-space-size={{ int (div (mul .Values.services.print.memLimits 90) 100) }}
          - bundle.js
        {{- include "platform.resources" (dict "root" . "service" "print") | nindent 8 }}
        ports:
        - containerPort: 4005
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "print") | nindent 8 }}
        - name: EXTERNAL_REGIONS
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: EXTERNAL_REGIONS
        - name: PORT
          value: '4005'
        - name: STATS_URL
          value: http://stats-service
        - name: ACCOUNTS_URL
          value: http://account
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        {{- include "platform.otelEnv" . | nindent 8 }}
{{- end }}
