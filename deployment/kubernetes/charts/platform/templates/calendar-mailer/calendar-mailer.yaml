# 
# source: kube/calendar-mailer/calendar-mailer.yaml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if index .Values.services "calendar-mailer" "enabled" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-mailer
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ index .Values.services "calendar-mailer" "replicas" }}
  selector:
    matchLabels:
      app: calendar-mailer
  template:
    metadata:
      labels:
        app: calendar-mailer
    spec:
      tolerations:
      - key: 'node.kubernetes.io/unreachable'
        operator: 'Exists'
        effect: 'NoExecute'
        tolerationSeconds: 10
      - key: 'node.kubernetes.io/not-ready'
        operator: 'Exists'
        effect: 'NoExecute'
        tolerationSeconds: 10
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "calendar-mailer") }}
        resources:
          requests:
            memory: '{{ index .Values.services "calendar-mailer" "memRequired" }}M'
          limits:
            memory: '{{ index .Values.services "calendar-mailer" "memLimits" }}M'
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "calendar-mailer") | nindent 8 }}
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: ACCOUNTS_URL
          value: http://account
        - name: QUEUE_REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn

{{- end }}
