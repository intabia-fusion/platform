# 
# source: kube/sign/service.yaml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.sign.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: sign-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: sign-service
  ports:
  - port: 80
    targetPort: 4006

{{- end }}
