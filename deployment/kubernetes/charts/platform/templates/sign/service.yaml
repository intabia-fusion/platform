# source: kube/sign/service.yaml; subs: version, hostUrl, namespace
{{- if .Values.services.sign.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: sign-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: sign-service
  ports:
  - port: 80
    targetPort: 4006

{{- end }}
