# 
# source: kube/sign/sign.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
{{- if .Values.services.sign.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sign-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.sign.replicas }}
  selector:
    matchLabels:
      app: sign-service
  template:
    metadata:
      labels:
        app: sign-service
    spec:
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "sign") }}
        resources:
          requests:
            memory: '{{ .Values.services.sign.memRequired }}M'
          limits:
            memory: '{{ .Values.services.sign.memLimits }}M'
        ports:
        - containerPort: 4006
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        - mountPath: /var/cfg/certificate.p12
          name: sign
          subPath: certificate.p12
        - mountPath: /var/cfg/branding.json
          name: branding
          subPath: branding.json
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "sign") | nindent 8 }}
        - name: EXTERNAL_REGIONS
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: EXTERNAL_REGIONS
        - name: PORT
          value: '4006'
        - name: STATS_URL
          value: http://stats-service
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: SERVICE_ID
          value: sign-service
        - name: ACCOUNTS_URL
          value: http://account
        - name: CERTIFICATE_PATH
          value: /var/cfg/certificate.p12
        - name: CERTIFICATE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: signPassword
        - name: BRANDING_PATH
          value: /var/cfg/branding.json
        - name: STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      - secret:
          items:
          - key: certificate.p12
            path: certificate.p12
          secretName: sign-secret
        name: sign
      - configMap:
          items:
          - key: branding.json
            path: branding.json
          name: branding
        name: branding

{{- end }}
