# source: kube/billing/ingress.yml; subs: version, hostUrl, namespace
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-billing
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_billing"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: billing-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_billing`)
    kind: Rule
    services:
    - name: billing
      port: 80
    middlewares:
    - name: strip-billing
