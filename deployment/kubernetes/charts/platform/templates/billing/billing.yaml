# 
# source: kube/billing/billing.yaml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  labels:
    app: billing
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.billing.replicas }}
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      {{- if or .Values.global.tls.caSecretName .Values.global.coverage.enabled }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- include "platform.coverageVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: billing
        image: {{ include "platform.containerImage" (dict "root" . "service" "billing") }}
        ports:
        - containerPort: 4090
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if or .Values.global.tls.caSecretName .Values.global.coverage.enabled }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- include "platform.coverageVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "billing") | nindent 8 }}
        - name: PORT
          value: '4090'
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: ACCOUNTS_URL
          value: http://account
        - name: STATS_URL
          value: http://stats-service
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: QUEUE_REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: dbUrl
        - name: POSTGRES_OPTIONS
          value: '{"connection":{"application_name":"billing"},"max":2}'
        - name: STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn
        - name: USAGE_UPDATE_INTERVAL
          value: '{{ .Values.services.billing.usageUpdateInterval }}'
        resources:
          requests:
            memory: '{{ .Values.services.billing.memRequired }}M'
          limits:
            memory: '{{ .Values.services.billing.memLimits }}M'
