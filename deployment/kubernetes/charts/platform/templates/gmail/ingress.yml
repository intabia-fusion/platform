# source: kube/gmail/ingress.yml; subs: version, hostUrl, namespace
{{- if .Values.services.gmail.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-gmail
  namespace: '{{ .Values.global.namespace }}'
spec:
  stripPrefix:
    prefixes:
    - "/_gmail"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gmail-ingressroute
  namespace: '{{ .Values.global.namespace }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.global.hostUrl }}`) && PathPrefix(`/_gmail`)
    kind: Rule
    services:
    - name: gmail-service
      port: 80
    middlewares:
    - name: strip-gmail

{{- end }}
