# source: kube/gmail/gmail.yml; subs: version, hostUrl, namespace
{{- if .Values.services.gmail.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gmail-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.gmail.replicas }}
  selector:
    matchLabels:
      app: gmail-service
  template:
    metadata:
      labels:
        app: gmail-service
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- if .Values.global.tls.caSecretName }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 6 }}
      {{- end }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "gmail") }}
        {{- include "platform.resources" (dict "root" . "service" "gmail") | nindent 8 }}
        ports:
        - containerPort: 8087
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        {{- if .Values.global.tls.caSecretName }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 8 }}
        {{- end }}
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "gmail") | nindent 8 }}
        - name: EXTERNAL_REGIONS
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: EXTERNAL_REGIONS
        - name: STATS_URL
          value: http://stats-service
        - name: WATCH_TOPIC_NAME
          valueFrom:
            secretKeyRef:
              name: gmail-api
              key: gmail_sub_topic
        - name: Credentials
          valueFrom:
            secretKeyRef:
              name: gmail-api
              key: credentials
        - name: ACCOUNTS_URL
          value: http://account
        - name: SYSTEM_EMAIL
          value: anticrm@hc.engineering
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        - name: KVS_URL
          value: http://kvs
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: QUEUE_REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: VERSION
          value: v2
        {{- include "platform.otelEnv" . | nindent 8 }}
{{- end }}
