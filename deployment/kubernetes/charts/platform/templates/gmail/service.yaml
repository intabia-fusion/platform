# source: kube/gmail/service.yaml; subs: version, hostUrl, namespace
{{- if .Values.services.gmail.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: gmail-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  selector:
    app: gmail-service
  ports:
  - port: 80
    targetPort: 8087

{{- end }}
