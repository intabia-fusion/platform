#
# source: kube/notifications/notifications.yml
# substitutions:
#   image tags -> :{{ .Values.global.version }}
#   hosts -> {{ .Values.global.hostUrl }}
#   namespace -> {{ .Values.global.namespace }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.notifications.replicas }}
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
    spec:
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "notifications") }}
        resources:
          requests:
            memory: '{{ .Values.services.notifications.memRequired }}M'
          limits:
            memory: '{{ .Values.services.notifications.memLimits }}M'
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 10 }}
          - mountPath: /var/cfg/branding.json
            name: branding
            subPath: branding.json
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "notifications") | nindent 8 }}
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: ACCOUNTS_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: accountsUrl
        - name: FRONT_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: frontUrl
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: dbUrl
        - name: QUEUE_REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        - name: BRANDING_PATH
          value: /var/cfg/branding.json
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: OTEL_EXPORTER_OTLP_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: platform-otel-config
              key: OTEL_EXPORTER_OTLP_COMPRESSION
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: uptraceDsn
      volumes:
      {{- include "platform.caVolume" $ | nindent 8 }}
        - configMap:
            items:
              - key: branding.json
                path: branding.json
            name: branding
          name: branding
