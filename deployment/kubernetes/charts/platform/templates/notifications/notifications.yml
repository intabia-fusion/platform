# source: kube/notifications/notifications.yml; subs: version, hostUrl, namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: '{{ .Values.global.namespace }}'
spec:
  replicas: {{ .Values.services.notifications.replicas }}
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
      annotations:
        checksum/platform-env: {{ include "platform.envChecksum" . | quote }}
    spec:
      {{- include "platform.tolerations" . | nindent 6 }}
      {{- include "platform.nodeSelector" (dict "root" . "service" "notifications") | nindent 6 }}
      containers:
      - name: app
        image: {{ include "platform.containerImage" (dict "root" . "service" "notifications") }}
        {{- include "platform.resources" (dict "root" . "service" "notifications") | nindent 8 }}
        imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
        volumeMounts:
        {{- include "platform.caVolumeMount" $ | nindent 10 }}
          - mountPath: /var/cfg/branding.json
            name: branding
            subPath: branding.json
        env:
        {{- include "platform.extraEnv" (dict "root" $ "service" "notifications") | nindent 8 }}
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: serverSecret
        - name: QUEUE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: queueConfig
        - name: ACCOUNTS_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: accountsUrl
        - name: FRONT_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: frontUrl
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: dbUrl
        - name: QUEUE_REGION
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REGION
        - name: STORAGE_CONFIG
          valueFrom:
            secretKeyRef:
              name: platform-secret
              key: storageConfig
        - name: BRANDING_PATH
          value: /var/cfg/branding.json
        {{- include "platform.otelEnv" . | nindent 8 }}
      volumes:
      {{- include "platform.caVolume" $ | nindent 8 }}
        - configMap:
            items:
              - key: branding.json
                path: branding.json
            name: branding
          name: branding
