{{- if and .Values.resourceMetrics.enabled .Values.resourceMetrics.database.enabled }}
{{- $m := .Values.resourceMetrics }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring.clickstackName" . }}-metrics-database
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: monitoring-metrics-database
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.yaml: |
{{ include "monitoring.metricsDatabaseConfig" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring.clickstackName" . }}-metrics-database
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: monitoring-metrics-database
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: monitoring-metrics-database
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitoring-metrics-database
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include "monitoring.metricsDatabaseConfig" . | sha256sum | quote }}
    spec:
      serviceAccountName: {{ include "monitoring.clickstackName" . }}-metrics
      containers:
        - name: collector
          image: {{ $m.collector.image }}
          args: ["--config=/etc/otel/config.yaml"]
          resources:
{{ toYaml $m.database.resources | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: {{ include "monitoring.clickstackName" . }}-metrics-database
{{- end }}
