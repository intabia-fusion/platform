{{- if and .Values.resourceMetrics.enabled .Values.resourceMetrics.node.enabled }}
{{- $m := .Values.resourceMetrics }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring.clickstackName" . }}-metrics-node
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: monitoring-metrics-node
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.yaml: |
{{ include "monitoring.metricsNodeConfig" . | indent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "monitoring.clickstackName" . }}-metrics-node
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: monitoring-metrics-node
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: monitoring-metrics-node
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitoring-metrics-node
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include "monitoring.metricsNodeConfig" . | sha256sum | quote }}
    spec:
      serviceAccountName: {{ include "monitoring.clickstackName" . }}-metrics
      # Control-plane nodes carry this taint; their CPU and memory are part of the cluster view.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: collector
          image: {{ $m.collector.image }}
          args: ["--config=/etc/otel/config.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
{{ toYaml $m.node.resources | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: host-proc
              mountPath: /hostfs/proc
              readOnly: true
            - name: host-sys
              mountPath: /hostfs/sys
              readOnly: true
            - name: host-root
              mountPath: /hostfs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "monitoring.clickstackName" . }}-metrics-node
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-sys
          hostPath:
            path: /sys
        - name: host-root
          hostPath:
            path: /
{{- end }}
