{{- if .Values.resourceMetrics.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "monitoring.clickstackName" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: monitoring-metrics
    app.kubernetes.io/instance: {{ .Release.Name }}
---
# kubeletstats reads the kubelet's /stats/summary through the node API; the node name comes from
# the downward API, and the collector authenticates with this service account.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "monitoring.clickstackName" . }}-metrics
  labels:
    app.kubernetes.io/name: monitoring-metrics
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/stats", "nodes/metrics", "nodes/log", "nodes/spec", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "monitoring.clickstackName" . }}-metrics
  labels:
    app.kubernetes.io/name: monitoring-metrics
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "monitoring.clickstackName" . }}-metrics
subjects:
  - kind: ServiceAccount
    name: {{ include "monitoring.clickstackName" . }}-metrics
    namespace: {{ .Release.Namespace }}
{{- end }}
