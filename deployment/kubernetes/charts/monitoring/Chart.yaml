apiVersion: v2
name: monitoring
description: "Observability stack for the fusion platform: ClickStack (ClickHouse, HyperDX, OpenTelemetry collector) plus the MongoDB that keeps HyperDX metadata. Platform services send OTLP to monitoring-otel-collector; the UI is port-forwarded until an Ingress is added."
type: application
version: 0.1.0
appVersion: "2.8.0"
keywords:
  - fusion
  - monitoring
  - observability
  - clickhouse
  - hyperdx
  - opentelemetry
maintainers:
  - name: haiodo
    email: haiodo@gmail.com
dependencies:
  # The upstream ClickStack chart ships ClickHouse, HyperDX, the collector and MongoDB with the
  # OTLP-to-ClickHouse wiring already in place; this chart only pins the topology and sizes that
  # a fusion stand needs. Bump the version together with appVersion after checking the release.
  - name: clickstack
    version: "1.1.1"
    repository: https://hyperdxio.github.io/helm-charts
    condition: clickstack.enabled
