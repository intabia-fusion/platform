# Values classes:
#   postgres - mode internal (StatefulSet) | external (connection string)
#   kafka    - mode strimzi (Kafka CR, operator installed by scripts) | external (bootstrap)
#   s3       - mode silo (StatefulSet pgsty/silo) | external (endpoint + keys)
#   elastic  - mode internal (elasticsearch + plugins PVC) | external (URL)
#   redis    - mode internal | external | disabled
#   mailpit  - enabled/disabled (SMTP catcher for stands)
#   tls      - default TLS certificate for traefik (TLSStore), created from local mkcert
#              material by certs/gen.sh; the chart only references the secret
#
# Modes are per-component; local stands keep every default. Prod overlays switch
# postgres/s3/elastic to external managed services - there are no separate prod manifests.

postgres:
  enabled: true
  mode: internal
  image: postgres:18.1
  user: postgres
  password: postgres
  storage: 2Gi
  storageClass: ""
  resources:
    requests: { memory: 128Mi, cpu: 50m }
    limits: { memory: 512Mi }
  # mode external:
  external:
    host: ""
    port: "5432"
    user: ""
    password: ""

kafka:
  enabled: true
  mode: strimzi
  # keep in sync with KAFKA_VERSION in cluster/versions.env (supported by pinned Strimzi)
  version: "4.2.2"
  storage: 4Gi
  storageClass: ""
  resources:
    requests: { memory: 512Mi, cpu: 100m }
    limits: { memory: 1200Mi }
  # JVM heap for the single broker
  jvmXms: 320m
  jvmXmx: 320m
  external:
    bootstrap: ""

s3:
  enabled: true
  mode: silo
  image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
  accessKey: minioadmin
  secretKey: minioadmin
  storage: 5Gi
  storageClass: ""
  resources:
    requests: { memory: 64Mi, cpu: 20m }
    limits: { memory: 512Mi }
  # mode external:
  external:
    endpoint: ""     # host:port, scheme added by the platform chart contract if missing
    accessKey: ""
    secretKey: ""
    region: auto
    location: eu
    kind: minio

elastic:
  enabled: true
  mode: internal
  image: elasticsearch:8.19.1
  pluginsImage: intabiafusion/elastic-plugins:8.19.1-slim
  heap: 512m
  storage: 2Gi
  storageClass: ""
  resources:
    requests: { memory: 640Mi, cpu: 100m }
    limits: { memory: 1400Mi }
  external:
    url: ""

redis:
  enabled: true
  mode: internal
  image: redis:8.0.2-alpine3.21
  resources:
    requests: { memory: 16Mi, cpu: 10m }
    limits: { memory: 128Mi }
  external:
    host: ""

mailpit:
  enabled: true
  image: axllent/mailpit:v1.33.0
  resources:
    requests: { memory: 32Mi, cpu: 20m }
    limits: { memory: 128Mi }

tls:
  # Namespace of the traefik installation; k3d ships traefik in kube-system, kind
  # gets it installed into the traefik namespace by scripts/base-up.sh.
  traefikNamespace: kube-system
  # Secret with the wildcard certificate, created by certs/gen.sh (mkcert).
  certificateSecret: fusion-local-tls
