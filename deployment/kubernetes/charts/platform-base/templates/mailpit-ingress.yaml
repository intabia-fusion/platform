{{- /*
Web UI for the stands' SMTP catcher. The platform charts' IngressRoutes carry no
tls section: traefik serves the wildcard certificate from the default TLSStore
(see tlsstore.yaml), so *.fusion.localhost works for mailpit too.

Empty mailpit.host renders nothing - SMTP stays reachable in-cluster at
mailpit.platform-base.svc.cluster.local:1025, and no mailbox is published.
*/}}
{{- if and .Values.mailpit.enabled .Values.mailpit.host }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mailpit
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: mailpit
    chart: '{{ .Chart.Name }}-{{ .Chart.Version }}'
    release: '{{ .Release.Name }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.mailpit.host }}`)
    kind: Rule
    services:
    - name: mailpit
      port: 8025
{{- end }}
