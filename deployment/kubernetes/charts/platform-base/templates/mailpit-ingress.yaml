{{- /*
Web UI for the stands' SMTP catcher. The platform charts' IngressRoutes carry no
tls section: traefik serves the wildcard certificate from the default TLSStore
(see tlsstore.yaml), so *.fusion.localhost works for mailpit too.

Empty mailpit.host renders nothing - SMTP stays reachable in-cluster at
mailpit.platform-base.svc.cluster.local:1025, and no mailbox is published.

mailpit.auth restricts the published mailbox with Traefik basic auth. users is an htpasswd
line stored in the stand values, not in the chart defaults.
*/}}
{{- if and .Values.mailpit.enabled .Values.mailpit.host }}
{{- if .Values.mailpit.auth.enabled }}
{{- if not .Values.mailpit.auth.users }}{{ fail "mailpit.auth.users is empty: set an htpasswd line or disable mailpit.auth" }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mailpit-auth
  namespace: '{{ .Release.Namespace }}'
type: Opaque
stringData:
  users: |
{{ .Values.mailpit.auth.users | indent 4 }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mailpit-auth
  namespace: '{{ .Release.Namespace }}'
spec:
  basicAuth:
    secret: mailpit-auth
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mailpit
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: mailpit
    chart: '{{ .Chart.Name }}-{{ .Chart.Version }}'
    release: '{{ .Release.Name }}'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`{{ .Values.mailpit.host }}`)
    kind: Rule
    services:
    - name: mailpit
      port: 8025
{{- if .Values.mailpit.auth.enabled }}
    middlewares:
    - name: mailpit-auth
{{- end }}
{{- end }}
