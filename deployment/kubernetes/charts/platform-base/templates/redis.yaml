{{- if and .Values.redis.enabled (eq .Values.redis.mode "internal") }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: redis
    chart: '{{ .Chart.Name }}-{{ .Chart.Version }}'
    release: '{{ .Release.Name }}'
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: redis
    chart: '{{ .Chart.Name }}-{{ .Chart.Version }}'
    release: '{{ .Release.Name }}'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        release: '{{ .Release.Name }}'
    spec:
      containers:
      - name: redis
        image: '{{ .Values.redis.image }}'
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
        resources:
{{ toYaml .Values.redis.resources | indent 10 }}
{{- end }}
