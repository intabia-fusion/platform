# QMS test stand: namespace fusion-qms, host qms.fusion.localhost.
# Playwright против этого стенда: pnpm run uitest:k8s в qms-tests/sanity
# (см. deployment/kubernetes/README.md). Паритет compose qms-tests: без
# payment/tbank (их не было в qms-tests/docker-compose.yaml), billing с быстрым
# usageUpdateInterval, transactor с расширенным rate limit, sign с debug-сертификатом
# (подпись PDF в QMS-диалогах), navigator без скрытых фич - QMS-спеки ходят в documents.

global:
  namespace: fusion-qms
  version: latest
  hostUrl: qms.fusion.localhost
  imageRegistry: k3d-fusion-registry:5000
  imagePullPolicy: Always
  # namespace контракта ConfigMap/Secret platform-base (ставит platform-base)
  baseNamespace: platform-base
  # имя данных стенда (БД/bucket/постфикс/индекс): 3 символа - минимум правил S3 bucket
  stand: qms
  tls:
    caSecretName: fusion-local-ca
  landingUrl: ""
  productName: Intabia Platform QMS
  defaultLanguage: en
  lastNameFirst: true

config:
  REGION: ""
  EXTERNAL_REGIONS: "--"
  useOtp: "false"
  temporalUrl: ""
  regions:
  - id: ""
    name: Default
    transactorService: transactor0
    transactorPath: /_tr0
    collaboratorService: collaborator0
    collaboratorPath: /_cl0
  livekitWs: "ws://127.0.0.1:7890"
  livekitHost: "ws://host.docker.internal:7890"

dbInit:
  enabled: true

# Тот же branding, что и qms-tests/branding-test.json на compose-стенде,
# под ключ публичного хоста стенда (dev-front подменяет его на localhost:<PORT>).
branding: |-
  {
    "qms.fusion.localhost": {
      "key": "huly",
      "title": "Platform",
      "protocol": "https",
      "languages": "en,ru,pt,es,zh,fr",
      "defaultLanguage": "en",
      "defaultApplication": "tracker",
      "defaultSpace": "tracker:project:DefaultProject",
      "defaultSpecial": "issues",
      "lastNameFirst": "true",
      "links": [
        {
          "rel": "manifest",
          "href": "/platform/site.webmanifest"
        },
        {
          "rel": "icon",
          "href": "/platform/favicon.svg",
          "type": "image/svg+xml"
        },
        {
          "rel": "shortcut icon",
          "href": "/platform/favicon.ico",
          "sizes": "any"
        },
        {
          "rel": "apple-touch-icon",
          "href": "/platform/icon-192.png"
        }
      ]
    }
  }

secrets:
  loveSecret:
    apiKey: "testkey"
    apiSecret: "testsecret_for_qms_tests_min32chars"
    webhookApiKey: "whqmskey"
    s3StorageConfig: "s3|http://s3.platform-base.svc.cluster.local:9000?accessKey=minioadmin&secretKey=minioadmin&rootBucket=qms-love-recordings"
    webhookApiSecret: "whqmssecret_for_qms_tests_min32chars"
  signSecret:
    # debug-сертификат pod-sign (services/sign/pod-sign/debug/certificate.p12),
    # compose-стенд мапил тот же файл. Base64 - значением в Secret как есть.
    certificate.p12: ""
  platform:
    # Compose parity: the test helpers (dev/tool) generate tokens with the
    # hardcoded 'secret' - do not "strengthen" this per stand.
    serverSecret: "secret"
    mailAuthToken: "qms-mail-token"
    aibotApiToken: "qms-aibot-api-token"
    signPassword: "qms-sign-password"
    smtpMode: "queue"
    smtpHost: mailpit.platform-base.svc.cluster.local
    smtpPort: "1025"
    smtpFrom: noreply@qms.fusion.localhost

services:
  # compose parity (qms-tests/docker-compose.yaml): billing ran without the
  # payment provider and tbank; keep both off
  billing:
    usageUpdateInterval: 600
    extraEnv:
    - name: ALLOW_TEST_ENDPOINTS
      value: "true"
  account:
    # parity with the compose qms stand
    passwords: none
    adminEmails: "admin"
    extraEnv:
    - name: ALLOW_SKIP_OTP_PASSWORD_SIGNUP
      value: "true"
    - name: WORKSPACE_LIMIT_PER_USER
      value: "100"
    - name: AUTH_RATE_LIMIT
      value: "100000"
  transactor:
    # compose parity: QMS bulk traffic bursts far above the prod per-client limit
    rateLimitMax: 25000
    rateLimitWindow: 1000
    extraEnv:
    - name: LAST_NAME_FIRST
      value: "true"
  front:
    replicas: 1
    # QMS specs drive controlled documents: the chart default hides 'documents'
    # (and more) from the navigator - the compose stand showed everything
    disabledFeatures: []
  workspace:
    replicas: 1
    extraEnv:
    - name: WAIT_TIMEOUT
      value: "100"
  sign:
    # compose parity: подпись PDF в QMS-диалогах (debug-сертификат выше)
    enabled: true
  # Внимание: шаблоны этих сервисов не читают enabled, гасим репликами
  # distro - сборка desktop-приложений, в compose dev закомментирован
  distro:
    replicas: 0
  analytics:
    replicas: 0
  loveAgent:
    replicas: 0
  preview:
    replicas: 0
  linkPreview:
    replicas: 0
