name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0). Bumps all publishable packages before publish.'
        required: true
      ref:
        description: 'Git ref to checkout (branch or tag)'
        required: true
        default: 'develop'

jobs:
  publish-npm:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache rush/pnpm store
        uses: actions/cache@v4
        with:
          path: common/temp
          key: ${{ runner.os }}-build-cache-node-foundation-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-build-cache-node-foundation-

      - name: Install
        run: node common/scripts/install-run-rush.js install

      - name: Bump versions
        run: node common/scripts/bump.js --fix "${{ github.event.inputs.version }}"

      - name: Validate (build + lint + test)
        run: node common/scripts/install-run-rush.js fast-build:validate

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          npm whoami
          node common/scripts/bump.js --publish "${{ github.event.inputs.version }}"
