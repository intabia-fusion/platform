      #   uses: ryand56/r2-upload-action@latest
      #   with:
      #     r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
      #     r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
      #     r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      #     r2-bucket: desktop-distro
      #     source-dir: desktop-package/${{ env.PublishTempFolder}}
      #     destination-dir: ./
      - name: Upload MacOS
        uses: actions/upload-artifact@v4
        with:
          name: Platform-MacOS-x64
          path: ./desktop-package/deploy/Platform-macos-*-x64.dmg
      - name: Upload MacOS Zip
        uses: actions/upload-artifact@v4
        with:
          name: Platform-MacOS-zip
          path: ./desktop-package/deploy/Platform-macos*.zip
      - name: Upload MacOS arm64
        uses: actions/upload-artifact@v4
        with:
          name: Platform-MacOS-arm64
          path: ./desktop-package/deploy/Platform-macos-*-arm64.dmg
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Platform-Windows
          path: ./desktop-package/deploy/Platform-windows-*.exe
      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: Platform-Windows-zip
          path: ./desktop-package/deploy/Platform-windows-*.zip
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: Platform-Linux-arm64
          path: ./desktop-package/deploy/Platform-linux-*-arm64.zip
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: Platform-Linux-x64
          path: ./desktop-package/deploy/Platform-linux-*-x64.zip

      - name: Upload Linux App image
        uses: actions/upload-artifact@v4
        with:
          name: Platform-Linux-AppImage
          path: ./desktop-package/deploy/Platform-linux-*.AppImage

      - name: List deploy contents
        run: |
          cd desktop-package
          echo "Files in deploy directory:"
          ls -la deploy/

      - name: Build server bundle (macOS only)
        run: |
          cd desktop-package
          node ../common/scripts/install-run-rushx.js bundle:server

      - name: Upload server bundle
        uses: actions/upload-artifact@v4
        with:
          name: server-bundle
          path: ./desktop-package/bundle
      - name: Upload manifests (yml + blockmap)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-manifests
          path: |
            ./desktop-package/deploy/*.yml
            ./desktop-package/deploy/*.yaml
            ./desktop-package/deploy/*.blockmap

      - name: Set release info
        id: release_info
        run: |
          echo "release_tag=$(node common/scripts/show_tag.js)" >> $GITHUB_OUTPUT
          echo "rev=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
  dist-build-docker:
    needs: dist-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Configure docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Download Platform-MacOS-x64
        uses: actions/download-artifact@v4
        with:
          name: Platform-MacOS-x64
          path: ./desktop-package/deploy
      - name: Download Platform-MacOS-arm64
        uses: actions/download-artifact@v4
        with:
          name: Platform-MacOS-arm64
          path: ./desktop-package/deploy
      - name: Download Platform-MacOS-zip
        uses: actions/download-artifact@v4
        with:
          name: Platform-MacOS-zip
          path: ./desktop-package/deploy
      - name: Download Platform-Windows
        uses: actions/download-artifact@v4
        with:
          name: Platform-Windows
          path: ./desktop-package/deploy
      - name: Download Platform-Windows-zip
        uses: actions/download-artifact@v4
        with:
          name: Platform-Windows-zip
          path: ./desktop-package/deploy
      # - name: Download Platform-Linux-arm64
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: Platform-Linux-arm64
      #     path: ./desktop-package/deploy
      - name: Download Platform-Linux-x64
        uses: actions/download-artifact@v4
        with:
          name: Platform-Linux-x64
          path: ./desktop-package/deploy
      - name: Download Platform-Linux-AppImage
        uses: actions/download-artifact@v4
        with:
          name: Platform-Linux-AppImage
          path: ./desktop-package/deploy
      - name: Download server-bundle
        uses: actions/download-artifact@v4
        with:
          name: server-bundle
          path: ./desktop-package/bundle
      - name: Download desktop-manifests
        uses: actions/download-artifact@v4
        with:
          name: desktop-manifests
          path: ./desktop-package/deploy

      - name: List downloaded artifacts
        run: ls -R ./desktop-package/deploy || true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: intabiafusion
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push Docker image (via package script)
        run: |
          set -euo pipefail
          cd desktop-package
          ../common/scripts/docker_build.sh intabiafusion/desktop-distro
          ../common/scripts/docker_tag.sh intabiafusion/desktop-distro
        env:
          DOCKER_CLI_HINTS: false
          DOCKER_BUILDKIT: 1
          BUILD_REV: ${{ needs.dist-build.outputs.rev }}
          RELEASE_TAG: ${{ needs.dist-build.outputs.release_tag }}
