# This is a basic workflow to help you get started with Actions

name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [develop]
    tags:
      - v*
      - s*
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [develop, staging, staging-new, main]
    paths-ignore:
      - 'docs/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      run-cockroach:
        description: 'Run CockroachDB tests (with profiling)'
        required: false
        default: 'false'
        type: boolean

env:
  CacheFolders: |
    communication
    common
    desktop
    desktop-package
    foundations
    dev
    models
    packages
    plugins
    pods
    server
    server-plugins
    templates
    services
    workers
    tests
    rush.json
    .prettierrc
    tools
    workers
    ws-tests
  PublishTempFolder: publish_artifacts
  INIT_SCRIPTS_BRANCH: 'main'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: cache-node-platform
        with:
          path: |
            common/temp
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      # - name: Cheking model is updated...
      #   run: node common/scripts/check_model_version.js

      - name: Checking for mis-matching dependencies...
        run: node common/scripts/install-run-rush.js check

      - name: Checking for mis-matching transitive dependencies...
        run: node common/scripts/check-versions.js

      - name: Installing...
        run: node common/scripts/install-run-rush.js install

      - name: Model version from git tags
        run: node common/scripts/install-run-rush.js model-version

      - name: Bundle...
        run: node common/scripts/install-run-rush.js bundle

      - name: Validate...
        run: node common/scripts/install-run-rush.js validate

      - name: Cache build results
        uses: actions/cache@v5
        env:
          cache-name: cache-build-results
        with:
          path: ${{ env.CacheFolders}}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.sha }}
  svelte-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Cache build results
        uses: actions/cache@v5
        env:
          cache-name: cache-build-results
        with:
          path: ${{ env.CacheFolders}}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.sha }}

      - name: Checking svelte sources...
        run: node common/scripts/install-run-rush.js svelte-check -v
  formatting:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Cache build results
        uses: actions/cache@v5
        env:
          cache-name: cache-build-results
        with:
          path: ${{ env.CacheFolders}}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.sha }}

      - name: Formatting...
        run: node common/scripts/install-run-rush.js fast-format --branch ${{ github.base_ref || 'develop' }}
      - name: Check files formatting
        run: |
          echo '================================================================'
          echo 'Checking for diff files'
          echo '================================================================'
          git diff '*.js' '*.ts' '*.svelte' '*.json' '*.yaml' | cat
          [ -z "$(git diff --name-only '*.js' '*.ts' '*.svelte' '*.json' '*.yaml' | cat)" ]
          echo '================================================================'
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Cache build results
        uses: actions/cache@v5
        env:
          cache-name: cache-build-results
        with:
          path: ${{ env.CacheFolders}}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.sha }}

      - name: Prepare server (with rate limit retry)
        run: |
          set -o pipefail
          cd ./tests
          if ./prepare-tests.sh 2>&1 | tee /tmp/prepare-tests.log; then
            echo "Prepare succeeded"
          else
            if grep -qi "rate limit\|too many requests\|toomanyrequests\|429" /tmp/prepare-tests.log; then
              echo "Rate limit hit, logging in to Docker Hub and retrying..."
              echo "${{ secrets.DOCKER_ACCESS_TOKEN }}" | docker login -u intabiafusion --password-stdin
              ./prepare-tests.sh
            else
              echo "Prepare failed (not a rate limit issue)"
              cat /tmp/prepare-tests.log
              exit 1
            fi
          fi
      - name: Testing...
        run: node common/scripts/install-run-rush.js test --verbose
        env:
          DB_URL: 'postgresql://root@localhost:26258/defaultdb?sslmode=disable'
          ELASTIC_URL: 'http://localhost:9201'
          MONGO_URL: 'mongodb://localhost:27018'
          POSTGRES_URL: 'postgresql://postgres:postgres@localhost:5433/postgres'

  uitest-cockroach:
    if: inputs.run-cockroach == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - name: Free space
        uses: ./.github/actions/free-disk-space
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: cache-node-platform
        with:
          path: |
            common/temp
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Checking for mis-matching dependencies...
        run: node common/scripts/install-run-rush.js check

      - name: Checking for mis-matching transitive dependencies...
        run: node common/scripts/check-versions.js

      - name: Installing...
        run: node common/scripts/install-run-rush.js install

      - name: Free space
        uses: ./.github/actions/free-disk-space
      - name: Docker Build (with rate limit retry)
        run: |
          set -o pipefail
          if node common/scripts/install-run-rush.js docker 2>&1 | tee /tmp/docker-build.log; then
            echo "Docker build succeeded"
          else
            if grep -qi "rate limit\|too many requests\|toomanyrequests\|429" /tmp/docker-build.log; then
              echo "Rate limit hit, logging in to Docker Hub and retrying..."
              echo "${{ secrets.DOCKER_ACCESS_TOKEN }}" | docker login -u intabiafusion --password-stdin
              node common/scripts/install-run-rush.js docker
            else
              echo "Docker build failed (not a rate limit issue)"
              cat /tmp/docker-build.log
              exit 1
            fi
          fi
        env:
          DOCKER_CLI_HINTS: false
          DOCKER_BUILDKIT: 1
      - name: Configure /etc/hosts
        run: |
          sudo echo "127.0.0.1 huly.local" | sudo tee -a /etc/hosts

      # CockroachDB tests with profiling
      - name: Run UI tests (CockroachDB)
        uses: ./.github/actions/ui-test
        with:
          test-folder: tests
          prepare-script: ./prepare-cockroach.sh
          build-package: '@hcengineering/tests-sanity'
          artifact-name-suffix: cockroach
          enable-profiling: 'true'
          docker-access-token: ${{ secrets.DOCKER_ACCESS_TOKEN }}

  uitest-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - name: Free space
        uses: ./.github/actions/free-disk-space
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: cache-node-platform
        with:
          path: |
            common/temp
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Checking for mis-matching dependencies...
        run: node common/scripts/install-run-rush.js check

      - name: Checking for mis-matching transitive dependencies...
        run: node common/scripts/check-versions.js

      - name: Installing...
        run: node common/scripts/install-run-rush.js install

      - name: Free space
        uses: ./.github/actions/free-disk-space
      - name: Docker Build (with rate limit retry)
        run: |
          set -o pipefail
          if node common/scripts/install-run-rush.js docker 2>&1 | tee /tmp/docker-build.log; then
            echo "Docker build succeeded"
          else
            if grep -qi "rate limit\|too many requests\|toomanyrequests\|429" /tmp/docker-build.log; then
              echo "Rate limit hit, logging in to Docker Hub and retrying..."
              echo "${{ secrets.DOCKER_ACCESS_TOKEN }}" | docker login -u intabiafusion --password-stdin
              node common/scripts/install-run-rush.js docker
            else
              echo "Docker build failed (not a rate limit issue)"
              cat /tmp/docker-build.log
              exit 1
            fi
          fi
        env:
          DOCKER_CLI_HINTS: false
          DOCKER_BUILDKIT: 1
      - name: Configure /etc/hosts
        run: |
          sudo echo "127.0.0.1 huly.local" | sudo tee -a /etc/hosts

      # PostgreSQL tests
      - name: Run UI tests (PostgreSQL)
        uses: ./.github/actions/ui-test
        with:
          test-folder: tests
          prepare-script: ./prepare-pg.sh
          build-package: '@hcengineering/tests-sanity'
          artifact-name-suffix: pg
          enable-profiling: 'true'
          docker-access-token: ${{ secrets.DOCKER_ACCESS_TOKEN }}

  uitest-workspaces:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - name: Free space
        uses: ./.github/actions/free-disk-space
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: cache-node-platform
        with:
          path: |
            common/temp
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Checking for mis-matching dependencies...
        run: node common/scripts/install-run-rush.js check

      - name: Checking for mis-matching transitive dependencies...
        run: node common/scripts/check-versions.js

      - name: Installing...
        run: node common/scripts/install-run-rush.js install

      - name: Free space
        uses: ./.github/actions/free-disk-space
      - name: Docker Build (with rate limit retry)
        run: |
          set -o pipefail
          if node common/scripts/install-run-rush.js docker 2>&1 | tee /tmp/docker-build.log; then
            echo "Docker build succeeded"
          else
            if grep -qi "rate limit\|too many requests\|toomanyrequests\|429" /tmp/docker-build.log; then
              echo "Rate limit hit, logging in to Docker Hub and retrying..."
              echo "${{ secrets.DOCKER_ACCESS_TOKEN }}" | docker login -u intabiafusion --password-stdin
              node common/scripts/install-run-rush.js docker
            else
              echo "Docker build failed (not a rate limit issue)"
              cat /tmp/docker-build.log
              exit 1
            fi
          fi
        env:
          DOCKER_CLI_HINTS: false
          DOCKER_BUILDKIT: 1
      - name: Configure /etc/hosts
        run: |
          sudo echo "127.0.0.1 huly.local" | sudo tee -a /etc/hosts

      # Workspace tests with API tests (first, fastest)
      - name: Run UI tests (Workspaces)
        uses: ./.github/actions/ui-test
        with:
          test-folder: ws-tests
          prepare-script: ./prepare.sh
          build-package: '@hcengineering/tests-ws-sanity'
          artifact-name-suffix: ws
          run-api-tests: 'true'
          docker-access-token: ${{ secrets.DOCKER_ACCESS_TOKEN }}

  docker-build:
    needs: [uitest-workspaces]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - name: Free space
        uses: ./.github/actions/free-disk-space
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Configure docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: cache-node-platform
        with:
          path: |
            common/temp
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Installing...
        run: node common/scripts/install-run-rush.js install

      - name: Model version from git tags
        run: node common/scripts/install-run-rush.js model-version

      - name: Docker build (with rate limit retry)
        run: |
          set -o pipefail
          docker system prune -a -f
          if node common/scripts/install-run-rush.js docker:build -v  2>&1 | tee /tmp/docker-build.log; then
            echo "Docker build succeeded"
          else
            if grep -qi "rate limit\|too many requests\|toomanyrequests\|429" /tmp/docker-build.log; then
              echo "Rate limit hit, logging in to Docker Hub and retrying..."
              echo "${{ secrets.DOCKER_ACCESS_TOKEN }}" | docker login -u intabiafusion --password-stdin
              node common/scripts/install-run-rush.js docker:build -v
            else
              echo "Docker build failed (not a rate limit issue)"
              cat /tmp/docker-build.log
              exit 1
            fi
          fi
          docker builder prune -a -f
        env:
          DOCKER_CLI_HINTS: false
          DOCKER_EXTRA: --platform=linux/amd64,linux/arm64
          DOCKER_BUILDKIT: 1
          DOCKER_BUILD_CLEANUP: true
      - name: Docker push tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/s') }}
        run: |
          echo Pushing release of tag ${{ github.ref }}
          echo "${{ secrets.DOCKER_ACCESS_TOKEN }}" | docker login -u intabiafusion --password-stdin
          node common/scripts/install-run-rush.js docker:push -v
  build-hulypulse:
    needs: [uitest-workspaces]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "Disk space after cleanup:"
          df -h
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Configure docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-platform
        with:
          path: |
            common/temp
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Docker build huly pulse (with rate limit retry)
        run: |
          set -o pipefail
          cd ./foundations/hulypulse
          if ../../common/scripts/docker_build.sh intabiafusion/hulypulse 2>&1 | tee /tmp/docker-build.log; then
            echo "Docker build succeeded"
          else
            if grep -qi "rate limit\|too many requests\|toomanyrequests\|429" /tmp/docker-build.log; then
              echo "Rate limit hit, logging in to Docker Hub and retrying..."
              echo "${{ secrets.DOCKER_ACCESS_TOKEN }}" | docker login -u intabiafusion --password-stdin
              ../../common/scripts/docker_build.sh intabiafusion/hulypulse
            else
              echo "Docker build failed (not a rate limit issue)"
              cat /tmp/docker-build.log
              exit 1
            fi
          fi
        env:
          DOCKER_CLI_HINTS: false
          DOCKER_EXTRA: --platform=linux/amd64,linux/arm64
      - name: Docker push tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/s') }}
        run: |
          echo Pushing release of tag ${{ github.ref }}
          echo "${{ secrets.DOCKER_ACCESS_TOKEN }}" | docker login -u intabiafusion --password-stdin
          cd ./foundations/hulypulse
          ../../common/scripts/docker_tag.sh intabiafusion/hulypulse

  dist-build:
    # if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/s') }}
    if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/s') }}
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.release_info.outputs.release_tag }}
      rev: ${{ steps.release_info.outputs.rev }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - name: Free space
        uses: ./.github/actions/free-disk-space
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: node
        with:
          path: |
            common/temp
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Installing...
        run: node common/scripts/install-run-rush.js install --purge
      - name: Model version from git tags
        run: node common/scripts/install-run-rush.js model-version
      - name: Package
        run: node common/scripts/install-run-rush.js package --to desktop -v
      - name: Bump package JSON version
        run: |
          cd desktop-package
          node ../common/scripts/install-run-rushx.js bump
          cat ./package.json
      # - name: Install the Apple certificate and provisioning profile
      #   env:
      #     DEV_ID_P12_BASE64: ${{ secrets.DEV_ID_P12_BASE64 }}
      #     DEV_ID_P12_PASSWORD: ${{ secrets.DEV_ID_P12_PASSWORD }}
