name: 'UI Test'
description: 'Run UI tests against a compose or Kubernetes stand'

inputs:
  test-folder:
    description: 'Test folder (tests or ws-tests)'
    required: true
  prepare-script:
    description: 'Prepare script to run'
    required: true
  build-package:
    description: 'Package to build before tests'
    required: true
  artifact-name-suffix:
    description: 'Suffix for artifact names'
    required: true
  enable-profiling:
    description: 'Whether to enable profiling (true/false)'
    required: false
    default: 'false'
  docker-access-token:
    description: 'Docker Hub access token for rate limit retry'
    required: false
    default: ''
  container-prefix:
    description: 'Compose project prefix of the stand containers (sanity- or qms-)'
    required: false
    default: 'sanity-'
  stand:
    description: 'Kubernetes stand name (sanity|ws|qms|api); empty runs the compose stand instead'
    required: false
    default: ''
  k8s-runtime:
    description: 'Kubernetes runtime for the stand (k3d|kind|existing)'
    required: false
    default: 'k3d'
  k8s-namespace:
    description: 'Namespace for the stand (default from deployment/kubernetes/stands/<stand>)'
    required: false
    default: ''
  k8s-cleanup:
    description: 'Cleanup after the run: none|stand|cluster (see common/scripts/ci-k8s-cleanup.sh)'
    required: false
    default: 'none'

runs:
  using: 'composite'
  steps:
    # ---------------------------------------------------------------- Kubernetes stands
    - name: Setup Kubernetes tools
      if: ${{ inputs.stand != '' }}
      shell: bash
      run: |
        source ./common/scripts/ci-k8s-tools.sh

    - name: Configure Kubernetes stand
      if: ${{ inputs.stand != '' }}
      shell: bash
      run: |
        stand="${{ inputs.stand }}"
        ns="${{ inputs.k8s-namespace }}"
        if [ -z "$ns" ]; then
          source ./deployment/kubernetes/scripts/lib.sh
          ns=$(stand_namespace "$stand")
        fi
        push_flag=--push-images
        [ "${{ inputs.k8s-runtime }}" = existing ] && push_flag=--no-push-images
        # Explicit flags/env win over any saved config; prepare brings the base up itself.
        pnpm -w stand:configure --runtime "${{ inputs.k8s-runtime }}" --namespace "$ns" "$push_flag" --yes
        # The saved config namespace targets the dev stand and test stands ignore it by design;
        # publish the resolved one so prepare, deploy, with-stand-env and the cleanup all use it.
        if [ -n "$ns" ]; then
          echo "STAND_NAMESPACE=$ns" >> "$GITHUB_ENV"
        fi

    - name: Prepare Kubernetes stand
      if: ${{ inputs.stand != '' }}
      shell: bash
      run: |
        set -o pipefail
        # No Docker Hub retry: the stand pulls images inside the cluster, so a host login
        # would not change the outcome. Keep the full log and fail.
        if deployment/kubernetes/scripts/prepare-test-stand.sh "${{ inputs.stand }}" "${{ inputs.k8s-runtime }}" 2>&1 | tee /tmp/prepare-server.log; then
          echo "Prepare succeeded"
        else
          echo "Prepare failed"
          cat /tmp/prepare-server.log
          exit 1
        fi
      # No LIVEKIT_MODE here: k3d stands use the shared cluster LiveKit; the docker mode needs the
      # compose redis (:6390) and is only valid for the compose path below.

    # make-media-fixtures.sh is called by the compose prepare only; a fresh checkout has neither
    # fixture. It generates them with the locally built stream and preview images and only warns
    # when Docker is missing, so check the result instead of trusting its exit code.
    - name: Generate sanity media fixtures
      if: ${{ inputs.stand == 'sanity' }}
      shell: bash
      run: |
        cd ./${{ inputs.test-folder }}
        ./make-media-fixtures.sh
        missing=()
        for f in sanity/tests/files/fake-video.mp4 sanity/tests/files/fake-doc.docx; do
          [ -f "$f" ] || missing+=("$f")
        done
        if [ ${#missing[@]} -ne 0 ]; then
          echo "ERROR: missing media fixtures: ${missing[*]}" >&2
          echo "make-media-fixtures.sh generates them from the local intabiafusion/stream and intabiafusion/preview images (pnpm docker:build); without those images the media and docx preview tests cannot run." >&2
          exit 1
        fi
        ls -l sanity/tests/files/fake-video.mp4 sanity/tests/files/fake-doc.docx

    # The ws suite drives the UI from a localhost:8081 dev-server; the chart serves only the stand's
    # own front. Host mode: a fresh runner has no dev-front image and building one costs a full
    # docker build per job. Webpack runs from dev/prod against the lib/ output `pnpm docker`
    # already emits for the stand images, so no extra compile step is needed.
    - name: Start test frontend
      if: ${{ inputs.stand == 'ws' }}
      shell: bash
      run: |
        set -m
        pnpm -w stand:test:front ws --host > /tmp/stand-front.log 2>&1 < /dev/null &
        echo "$!" > /tmp/stand-front.pid
        disown 2>/dev/null || true
        set +m
        echo "test frontend started (pid $(cat /tmp/stand-front.pid)), log: /tmp/stand-front.log"

    # ---------------------------------------------------------------- compose stands
    - name: Prepare server (with rate limit retry)
      if: ${{ inputs.stand == '' }}
      shell: bash
      run: |
        set -o pipefail
        cd ./${{ inputs.test-folder }}
        export DO_CLEAN=false
        # DO_CLEAN=false: docker system prune -a between test runs deletes locally built images needed by subsequent tests
        if ${{ inputs.prepare-script }} 2>&1 | tee /tmp/prepare-server.log; then
          echo "Prepare succeeded"
        else
          if grep -qi "rate limit\|too many requests\|toomanyrequests" /tmp/prepare-server.log; then
            echo "Rate limit hit, logging in to Docker Hub and retrying..."
            echo "$DOCKER_ACCESS_TOKEN" | docker login -u intabiafusion --password-stdin
            ${{ inputs.prepare-script }}
          else
            echo "Prepare failed (not a rate limit issue)"
            cat /tmp/prepare-server.log
            exit 1
          fi
        fi
      env:
        DOCKER_ACCESS_TOKEN: ${{ inputs.docker-access-token }}
        LIVEKIT_MODE: docker

    # ---------------------------------------------------------------- common
    - name: Build test package
      shell: bash
      run: |
        pnpm build --to ${{ inputs.build-package }}

    # The stand serves its own front image (the chart deploys it), so the suites talk to the
    # stand URL: no webpack dev-server and no full client build here. Developers who want HMR
    # against a stand run stand:test:front and the uitest:k8s:dev script themselves.

    - name: Install Playwright
      shell: bash
      run: |
        cd ./${{ inputs.test-folder }}/sanity
        pnpm run playwright:install

    - name: Start profiling
      if: inputs.enable-profiling == 'true'
      shell: bash
      run: |
        cd ./${{ inputs.test-folder }}
        ./profile-start.sh

    # Host stats around the run. The docker sampler is compose-only: k8s pods are not host
    # containers; pod diagnostics come from kubectl in "Store Kubernetes logs".
    - name: Start telemetry
      shell: bash
      run: |
        cd ./${{ inputs.test-folder }}/sanity
        mkdir -p runs/ci
        T=../../tests/sanity/telemetry
        node $T/stats.js rate --min 1 --max 10 --threshold 0.001 || true
        node $T/stats.js wipe || true
        if [ -z "${{ inputs.stand }}" ]; then
          node $T/docker-sampler.js --out runs/ci/docker.ndjson --filter ${{ inputs.container-prefix }} &
          echo $! > /tmp/telemetry-sampler.pid
        fi
        node $T/stats.js sample --out runs/ci/stats.ndjson --interval 1000 &
        echo $! > /tmp/telemetry-stats.pid

    - name: Wait for test frontend
      if: ${{ inputs.stand == 'ws' }}
      shell: bash
      run: |
        for _ in $(seq 1 450); do
          if curl -sf -o /dev/null http://localhost:8081/config.json; then
            echo "test frontend is serving on :8081"
            exit 0
          fi
          if ! kill -0 "$(cat /tmp/stand-front.pid)" 2>/dev/null; then
            echo "test frontend exited before it served :8081:" >&2
            tail -100 /tmp/stand-front.log >&2 || true
            exit 1
          fi
          sleep 2
        done
        echo "test frontend did not answer on :8081 within 15 min:" >&2
        tail -100 /tmp/stand-front.log >&2 || true
        exit 1

    - name: Run UI tests
      shell: bash
      run: |
        cd ./${{ inputs.test-folder }}/sanity
        if [ -n "${{ inputs.stand }}" ]; then
          pnpm run uitest:k8s
        else
          pnpm run uitest
        fi

    - name: Collect telemetry
      if: always()
      shell: bash
      run: |
        cd ./${{ inputs.test-folder }}/sanity
        T=../../tests/sanity/telemetry
        for pid in /tmp/telemetry-sampler.pid /tmp/telemetry-stats.pid; do
          if [ -f "$pid" ]; then kill -INT "$(cat "$pid")" 2>/dev/null || true; fi
        done
        sleep 2
        node $T/stats.js fetch --out runs/ci/stats.json || true
        node $T/stats.js rate --min 10 --max 300 --threshold 0.01 || true
        # Reports stay where they are - they already ship in the playwright-results artifact.
        if [ -n "${{ inputs.stand }}" ]; then
          node $T/collect-run.js --dir runs/ci --report playwright-report.json \
            --steps step-report.ndjson || true
        else
          node $T/collect-run.js --dir runs/ci --report playwright-report.json \
            --steps step-report.ndjson --docker runs/ci/docker.ndjson || true
        fi
        node $T/render-report.js --dir runs/ci || true

    # Written by the json reporter and step-reporter.ts; only tests/sanity configures both, the
    # other suites skip the blocks below.
    - name: Test report summary
      if: always()
      shell: bash
      run: |
        cd ./${{ inputs.test-folder }}/sanity
        {
          echo "## UI tests: ${{ inputs.artifact-name-suffix }}"
          if [ -f playwright-report.json ]; then
            echo '<details><summary>What broke</summary>'
            echo
            echo '```'
            node ../../tests/sanity/analyze_failures.js playwright-report.json || true
            echo '```'
            echo '</details>'
          fi
          if [ -f step-report.ndjson ]; then
            echo '<details><summary>Where the time went</summary>'
            echo
            echo '```'
            node ../../tests/sanity/analyze_steps.js step-report.ndjson --top 20 || true
            echo '```'
            echo '</details>'
          fi
          if [ -f runs/ci/run.json ]; then
            node ../../tests/sanity/telemetry/render-summary.js --dir runs/ci \
              --title 'Telemetry: ${{ inputs.artifact-name-suffix }}' || true
            echo
            echo 'Charts and per-second series: report.html in the telemetry-${{ inputs.artifact-name-suffix }} artifact.'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Download profile
      if: inputs.enable-profiling == 'true'
      shell: bash
      run: |
        cd ./${{ inputs.test-folder }}
        ./profile-download.sh
        npm install -g cpupro
        ./profile-generate.sh

    - name: Upload profiling results
      if: inputs.enable-profiling == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: profiling-${{ inputs.artifact-name-suffix }}
        path: ./${{ inputs.test-folder }}/profiles

    # Stand pods/logs/events, shared platform-base namespace and cluster node state; compose stores host container logs below.
    - name: Store Kubernetes logs
      if: ${{ always() && inputs.stand != '' }}
      shell: bash
      run: |
        cd ./${{ inputs.test-folder }}/sanity
        mkdir -p logs
        ../../common/scripts/k8s-stand-logs.sh ${{ inputs.stand }} logs || true

    - name: Store docker logs
      if: ${{ always() && inputs.stand == '' }}
      shell: bash
      run: |
        cd ./${{ inputs.test-folder }}/sanity
        mkdir -p logs
        cd logs
        docker ps -a --format '{{.Names}}' | xargs -I {} sh -c 'docker logs {} > {}_logs.log 2>&1'

    - name: Upload UI test results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: playwright-results-${{ inputs.artifact-name-suffix }}
        path: |
          ./${{ inputs.test-folder }}/sanity/playwright-report/
          ./${{ inputs.test-folder }}/sanity/playwright-report.json
          ./${{ inputs.test-folder }}/sanity/step-report.ndjson

    - name: Upload telemetry
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: telemetry-${{ inputs.artifact-name-suffix }}
        path: ./${{ inputs.test-folder }}/sanity/runs/ci
        if-no-files-found: ignore

    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.stand != '' && 'k8s' || 'docker' }}-logs-${{ inputs.artifact-name-suffix }}
        path: ./${{ inputs.test-folder }}/sanity/logs

    - name: Stop test frontend
      if: ${{ always() && inputs.stand == 'ws' }}
      shell: bash
      run: |
        if [ -f /tmp/stand-front.pid ]; then
          pid="$(cat /tmp/stand-front.pid)"
          kill -TERM -- "-$pid" 2>/dev/null || true
          rm -f /tmp/stand-front.pid
          echo "stopped test frontend (process group $pid)"
        fi

    - name: Cleanup Kubernetes stand
      if: ${{ always() && inputs.stand != '' }}
      shell: bash
      run: |
        STAND_CLEANUP=${{ inputs.k8s-cleanup }} ./common/scripts/ci-k8s-cleanup.sh ${{ inputs.stand }}
