# Настройки hum1izer для этого проекта.
# Файл ищется от проверяемого каталога вверх до корня, флаги его перекрывают.

version: 1
comments:
  # Комментарий длиннее скольких строк считать находкой. 0 отключает проверку.
  max_lines: 2
  # Сколько последних коммитов проверять, когда сканируется git-репозиторий.
  commits: 20
  skip_tests: false
  max_line: 95
languages:
  # Найдено в проекте: ts (3156), svelte (2576), js (1153), go (57)
  # only - белый список, пусто означает все поддерживаемые.
  only: []
  ignore: []
# Пути, которые не сканировать. ** проходит через каталоги, * внутри сегмента.
# node_modules, vendor, dist, gen и сгенерированные файлы пропускаются и так.
exclude: []
# Снимок известных находок. Без этой строки прогон без --baseline его не читает,
# и блоки, отложенные через fix --keep, всплывают снова.
baseline: .hum1izer-baseline.jsonl
rules:
  # only - белый список, пусто означает все. Имя берётся из отчёта: подходит
  # и имя правила, и имя категории целиком.
  only: []
  disable: []

# Чаще всего в этом проекте срабатывает:
#   3697  Длинный комментарий
#    240  Пересказ кода
#    231  TODO без владельца
#    211  loop through / returns the result
#     85  Закомментированный код
#     55  Баннер-разделитель
#     53  Markdown-эссе в комментарии
#     47  temporary / for now / will be removed
#     28  as you can see / let's / for demonstration
#     26  let's
# Если что-то из этого для проекта норма, перенеси имя в rules.disable.
