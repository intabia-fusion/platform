# Coverage overlay for the api-tests stand, on when STAND_COVERAGE=true. Adds NODE_V8_COVERAGE to the
# pods and mounts a directory per image for the profiles; `pnpm coverage:stand` maps them back onto
# src/ through each image's bundle sourcemap - the directory name is the image name.
#
# V8 writes a profile as the process exits, so the pods must shut down cleanly within the stop
# timeout (api/src/stand.ts gives them 60s); a pod that is killed leaves nothing.

services:
  transactor:
    environment:
      - NODE_V8_COVERAGE=/coverage
    volumes:
      - ./coverage/transactor:/coverage

  transactor-europe:
    environment:
      - NODE_V8_COVERAGE=/coverage
    volumes:
      - ./coverage/transactor:/coverage

  account:
    environment:
      - NODE_V8_COVERAGE=/coverage
    volumes:
      - ./coverage/account:/coverage

  workspace:
    environment:
      - NODE_V8_COVERAGE=/coverage
    volumes:
      - ./coverage/workspace:/coverage

  workspace_europe:
    environment:
      - NODE_V8_COVERAGE=/coverage
    volumes:
      - ./coverage/workspace:/coverage

  datalake:
    environment:
      - NODE_V8_COVERAGE=/coverage
    volumes:
      - ./coverage/datalake:/coverage

