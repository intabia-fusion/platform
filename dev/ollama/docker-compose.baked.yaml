# Ollama with the model baked into the image (offline, fast start for e2e/CI).
# Build the image first: cd dev/base-image && ./build.sh (or just the ollama target).
# No volume needed - the model ships inside intabiafusion/ollama-base.
services:
  ollama:
    image: intabiafusion/ollama-base:${OLLAMA_IMAGE_TAG:-latest}
    pull_policy: never
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_BIND_IP:-127.0.0.1}:11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_ORIGINS=${OLLAMA_ORIGINS:-}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
