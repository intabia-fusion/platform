# Overlay: run the payment stack against tbank-subscriptions with the in-process MOCK bank.
# No real terminal, no external gateway — the mock issues links and fires its own CONFIRMED webhook,
# so the full payment -> tbank-subscriptions -> confirm flow runs locally.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.tbank-mock.yaml up -d payment tbank-subscriptions
#
services:
  payment:
    environment:
      # Route to tbank-subscriptions instead of the built-in mock provider.
      - PROVIDER=tbank
      - TBANK_SUBSCRIPTIONS_URL=http://tbank-subscriptions:4042
      # Ensure the built-in mock provider is off.
      - ALLOW_MOCK_PROVIDER=false
      # Many subscription mutations in a row (dev/MCP) — lift the per-IP rate cap.
      - SUBSCRIPTION_RATE_LIMIT_MAX=100000

  tbank-subscriptions:
    environment:
      # In-process mock bank: no terminal credentials needed, self-fires the CONFIRMED webhook.
      - TBANK_MOCK=true
