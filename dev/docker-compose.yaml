services:
  stream:
    image: 'intabiafusion/stream'
    pull_policy: never
    extra_hosts:
      - 'huly.local:host-gateway'
    environment:
      - STREAM_ENDPOINT_URL=datalake://huly.local:4030
      - STREAM_INSECURE=true
      - STREAM_SERVER_SECRET=secret
      - STREAM_MAX_PARALLEL_SCALING_COUNT=6
      - STREAM_LOG_LEVEL=debug
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - STREAM_REGION=
      - STREAM_QUEUE_CONFIG=${QUEUE_CONFIG}
    ports:
      - 1080:1080
    restart: unless-stopped
  media:
    image: 'intabiafusion/media'
    extra_hosts:
      - 'huly.local:host-gateway'
    environment:
      - ACCOUNTS_URL=http://huly.local:3000
      - SECRET=secret
      - REGION=
      - QUEUE_CONFIG=${QUEUE_CONFIG}
    restart: unless-stopped
  preview:
    image: 'intabiafusion/preview'
    extra_hosts:
      - 'huly.local:host-gateway'
    environment:
      - SECRET=secret
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - CACHE_PATH=/data/cache
    ports:
      - 4040:4040
    restart: unless-stopped
  postgres:
    image: postgres:18.1
    command: ['postgres', '-p', '5432']
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -p 5432']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - dbpg:/var/lib/postgresql
    restart: unless-stopped
  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      - postgres
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - pgbouncer_logs:/var/log/pgbouncer
    ports:
      - 6432:6432
    environment:
      - PGBOUNCER_LISTEN_PORT=6432
      - PGBOUNCER_BACKENDS=postgres=postgres:5432/postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 || ps aux | grep -q pgbouncer']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v25.2.11
    extra_hosts:
      - 'huly.local:host-gateway'
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
      - --memory 256M
    volumes:
      - redpanda:/var/lib/redpanda/data
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'info']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redpanda_console:
    container_name: redpanda-console
    image: redpandadata/console:v3.2.2
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && /app/console'
    volumes:
      - ./config:/tmp/config/
    environment:
      CONFIG_FILEPATH: ${CONFIG_FILEPATH:-/tmp/config.yml}
      CONSOLE_CONFIG_FILE: |
        # Configure a connection to the Redpanda cluster
        # See https://docs.redpanda.com/current/console/config/connect-to-redpanda/
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
    ports:
      - 8000:8080
    depends_on:
      redpanda:
        condition: service_healthy
  minio:
    image: 'minio/minio'
    command: server /data --address ":9000" --console-address ":9001"
    extra_hosts:
      - 'huly.local:host-gateway'
    expose:
      - 9000
      - 9001
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - files:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10
    restart: unless-stopped
  elastic:
    image: 'elasticsearch:8.19.1'
    command: >
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q analysis-icu || ./bin/elasticsearch-plugin install --batch analysis-icu; exec /usr/local/bin/docker-entrypoint.sh eswrapper -Ediscovery.type=single-node -Expack.security.enabled=false -Expack.security.http.ssl.enabled=false"
    expose:
      - 9200
    extra_hosts:
      - 'huly.local:host-gateway'
    volumes:
      - elastic:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms450m -Xmx450m
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024m
  redis:
    image: redis:8.0.2-alpine3.21
    ports:
      - 6379:6379
    restart: unless-stopped

  account:
    image: intabiafusion/account
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - stats
    ports:
      - 3000:3000
    volumes:
      - ./branding.json:/var/cfg/branding.json
    environment:
      - ACCOUNT_PORT=3000
      - IGNORE_EMAIL_SIGNUP=false # Set to true if you want to disable email/otp confirmations
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - SERVER_SECRET=secret
      - ADMIN_EMAILS=admin,${PLATFORM_ADMIN_EMAILS}
      - STATS_URL=http://huly.local:4900
      - WORKSPACE_LIMIT_PER_USER=10000
      - DB_URL=${DB_URL_PG}
      # - DB_NS=account-2
      # Pass only one region to disallow selection for new workspaces.
      - REGION_INFO=|Default
      - TRANSACTOR_URL=ws://huly.local:3332;;
      - MAIL_URL=
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FRONT_URL=http://huly.local:8087
      - LAST_NAME_FIRST=true
      # - WS_LIVENESS_DAYS=1
      - ACCOUNTS_URL=http://huly.local:3000
      - BRANDING_PATH=/var/cfg/branding.json
      # - DISABLE_SIGNUP=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
      - MAILBOX_DOMAINS=huly.dev.local
      - MAILBOX_MAX_COUNT_PER_ACCOUNT=2
    restart: unless-stopped
  stats:
    image: intabiafusion/stats
    extra_hosts:
      - 'huly.local:host-gateway'
    ports:
      - 4900:4900
    environment:
      - PORT=4900
      - SERVER_SECRET=secret
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
    restart: unless-stopped
  # payment:
  #   image: intabiafusion/payment
  #   extra_hosts:
  #     - 'huly.local:host-gateway'
  #   ports:
  #     - 3040:3040
  #   environment:
  #     - SECRET=secret
  #     - PORT=3040
  #     - ACCOUNTS_URL=http://huly.local:3000
  #     - FRONT_URL=http://huly.local:8087
  #     - USE_SANDBOX=true
  #     - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN}
  #     - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET}
  #     - POLAR_SUBSCRIPTION_PLANS=${POLAR_SUBSCRIPTION_PLANS}
  #     - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
  #   restart: unless-stopped
  workspace:
    image: intabiafusion/workspace
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - postgres
      - minio
      - stats
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./branding.json:/var/cfg/branding.json
    environment:
      - WS_OPERATION=all+backup
      - REGION=
      - SERVER_SECRET=secret
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - DB_URL=${DB_URL_PG}
      - STATS_URL=http://huly.local:4900
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - ACCOUNTS_URL=http://huly.local:3000
      - ACCOUNTS_DB_URL=${DB_URL_PG}
      - BRANDING_PATH=/var/cfg/branding.json
      - BACKUP_STORAGE=${BACKUP_STORAGE_CONFIG}
      - BACKUP_BUCKET=${BACKUP_BUCKET_NAME}
      - MAIL_URL=
      # - INIT_WORKSPACE=staging-dev
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
    restart: unless-stopped
  collaborator:
    image: intabiafusion/collaborator
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - minio
      - transactor
      - stats
    ports:
      - 3078:3078
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=secret
      - ACCOUNTS_URL=http://huly.local:3000
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - STATS_URL=http://huly.local:4900
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
    restart: unless-stopped
  front:
