      # Content and History Limits
      - MAX_CONTENT_TOKENS=12800
      - MAX_HISTORY_RECORDS=500

      - STATS_URL=http://huly.local:4900
  analytics:
    image: intabiafusion/analytics-collector
    extra_hosts:
