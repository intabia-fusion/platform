      - PREVIEW_URL=http://huly.local:4040
      - GMAIL_URL=http://huly.local:8093
      - CALENDAR_URL=http://huly.local:8095
      - TELEGRAM_URL=http://huly.local:8086
      - REKONI_URL=http://huly.local:4004
      - COLLABORATOR_URL=ws://huly.local:3078
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - GITHUB_URL=http://huly.local:3500
      - PRINT_URL=http://huly.local:4005
      - SIGN_URL=http://huly.local:4006
      #      - ANALYTICS_COLLECTOR_URL=http://huly.local:4017
      - DESKTOP_UPDATES_URL=localhost
      - DESKTOP_UPDATES_CHANNEL=dev
      - DESKTOP_UPDATES_CHANNELS=dev;tracex:dev-tracex
      - BRANDING_URL=http://huly.local:8087/branding.json
      - STREAM_URL=http://huly.local:1080/recording
      - PAYMENT_URL=http://huly.local:3040
      - BILLING_URL=http://huly.local:4041
      - COMMUNICATION_API_ENABLED=false
      - BACKUP_URL=http://huly.local:4039/api/backup,
      - EXCLUDED_APPLICATIONS_FOR_ANONYMOUS=["chunter", "notification"]
      # - DISABLE_SIGNUP=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
      - PULSE_URL=ws://huly.local:8099/ws
      - DATALAKE_URL=http://huly.local:4030
      # - HULYLAKE_URL=http://huly.local:8096
      - AI_URL=http://huly.local:4010
      - LANDING_URL=http://huly.local:9078/landing/
      - LOVE_ENDPOINT=http://huly.local:8096
      - LIVEKIT_WS=ws://huly.local:7880
      - EXPORT_URL=http://huly.local:4009
      - LINK_PREVIEW_URL=http://huly.local:4042
      - PUSH_PUBLIC_KEY=${PUSH_PUBLIC_KEY}
      - USAGE_URL=http://huly.local:8080/terms
      - COPYRIGHT=
      - SUPPORT_URL=https://t.me/intabia
    restart: unless-stopped
  transactor:
    image: intabiafusion/transactor
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - postgres
      - minio
      - account
      - stats
    depends_on:
      redpanda:
        condition: service_started
    ports:
      - 3332:3332
    volumes:
      - ./branding.json:/var/cfg/branding.json
    environment:
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - SERVER_PORT=3332
      - REGION=
      - SERVER_SECRET=secret
      - ENABLE_COMPRESSION=true
      - FULLTEXT_URL=http://huly.local:4702
      - STATS_URL=http://huly.local:4900
      - DB_URL=${DB_URL_PG}
      - METRICS_CONSOLE=false
      - METRICS_FILE=metrics.txt
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FRONT_URL=http://huly.local:8087
#      - MAIL_URL=http://huly.local:8097
#      - MAIL_AUTH_TOKEN=naephea1Rai7eeth1noh
      - ACCOUNTS_URL=http://huly.local:3000
      - LAST_NAME_FIRST=true
      - BRANDING_PATH=/var/cfg/branding.json
      - AI_BOT_URL=http://huly.local:4010
      - COMMUNICATION_TIME_LOGGING_ENABLED=true
      - RATE_LIMIT_MAX=25000 # 250 requests per 30 seconds
      - RATE_LIMIT_WINDOW=3000
      - FILES_URL=http://huly.local:4030/blob/:workspace/:blobId/:filename
      - COMMUNICATION_API_ENABLED=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
      - HYLYLAKE_URL=http://huly.local:8096
      - AI_BOT_URL=http://huly.local:4010
      - WEB_PUSH_URL=http://notification:3335
    restart: unless-stopped
  rekoni:
    image: intabiafusion/rekoni-service
    extra_hosts:
      - 'huly.local:host-gateway'
    restart: unless-stopped
    ports:
      - 4004:4004
    environment:
      - STATS_URL=http://huly.local:4901
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
  fulltext:
    image: intabiafusion/fulltext
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      elastic:
        condition: service_healthy
    restart: unless-stopped
    links:
      - elastic
      - postgres
      - rekoni
    ports:
      - 4702:4702
    environment:
      - PORT=4702
      - REGION=
      - SERVER_SECRET=secret
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - DB_URL=${DB_URL_PG}
      - FULLTEXT_DB_URL=http://huly.local:9200
      - ELASTIC_INDEX_NAME=local_storage_index # Same index for simplicity
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - STATS_URL=http://huly.local:4900
      - REKONI_URL=http://huly.local:4004
      - ACCOUNTS_URL=http://huly.local:3000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
      # - HULYLAKE_URL=http://huly.local:8096
  print:
    image: intabiafusion/print
    extra_hosts:
      - 'huly.local:host-gateway'
    restart: unless-stopped
    ports:
      - 4005:4005
    environment:
      - SECRET=secret
      - REGION=
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - STATS_URL=http://huly.local:4900
      - ACCOUNTS_URL=http://huly.local:3000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://huly.local:4318
  sign:
    image: intabiafusion/sign
    extra_hosts:
      - 'huly.local:host-gateway'
    restart: unless-stopped
    ports:
      - 4006:4006
    volumes:
      - ../services/sign/pod-sign/debug/certificate.p12:/var/cfg/certificate.p12
      - ../services/sign/pod-sign/debug/branding.json:/var/cfg/branding.json
